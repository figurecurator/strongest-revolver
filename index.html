<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Strongest Revolver v0.18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#17120e;
    --panel:#241c15;
    --panel-hi:#2e241a;
    --line:#453424;
    --vellum:#e6dcc4;
    --dim:#93826a;
    --brass:#e0a93c;
    --sand:#c9a173;
    --steel:#7f8c96;
    --blood:#c1483a;
    --display:'Black Han Sans','Gothic A1',sans-serif;
    --body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{
    width:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;
    overscroll-behavior-x:none;background:var(--void);
  }
  body{
    width:100%;max-width:100%;min-width:0;overflow-x:hidden;overflow-x:clip;
    overscroll-behavior-x:none;touch-action:pan-y pinch-zoom;
    background:var(--void);
    color:var(--vellum);
    font-family:var(--body);
    -webkit-tap-highlight-color:transparent;
    padding:14px max(12px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  }
  .wrap{width:100%;max-width:760px;min-width:0;margin:0 auto}

  /* ── header ── */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .top>div:first-child{min-width:0}
  .title{font-family:var(--display);font-size:clamp(20px,5.6vw,30px);letter-spacing:-.02em;line-height:1}
  .title em{font-style:normal;color:var(--brass)}
  .sub{font-size:11px;color:var(--dim);letter-spacing:.1em;margin-top:6px}
  .sub b{color:var(--sand);font-weight:700;letter-spacing:.02em}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .chip{
    font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;
    border:1px solid var(--line);color:var(--sand);background:rgba(201,161,115,.08);
  }
  .chip.boss{color:#1a1208;background:var(--brass);border-color:var(--brass)}
  .chip.rewind{color:var(--brass);border-color:var(--brass);background:rgba(224,169,60,.10)}
  .purse{text-align:right;line-height:1.1;flex:none}
  .purse .k{font-size:10px;letter-spacing:.18em;color:var(--dim)}
  .purse .v{font-family:var(--mono);font-weight:700;font-size:clamp(17px,4.6vw,22px);color:var(--brass)}
  .purse .st{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--sand);margin-top:4px}
  .purse .st.cold{color:var(--dim)}
  .purse .st.run{color:var(--dim);margin-top:2px}

  /* ── field ── */
  .field-shell{
    position:relative;border:2px solid var(--line);border-radius:3px;
    background:#12100d;overflow:hidden;
  }
  canvas#field{display:block;width:100%;max-width:100%;height:clamp(260px,44vh,400px);touch-action:pan-y;-webkit-user-select:none;user-select:none}
  .banner{
    position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    font-family:var(--display);color:var(--brass);opacity:0;transition:opacity .1s;
    text-shadow:0 3px 0 #000;text-align:center;padding:0 16px;
  }
  .banner.on{opacity:1}
  .banner.quiet{font-size:clamp(20px,6vw,34px);color:#6b5b45;letter-spacing:.5em;text-shadow:none}
  .banner.shout{font-size:clamp(44px,13vw,84px);letter-spacing:.06em;color:#f0c25a}
  .banner.note{font-size:clamp(15px,4vw,22px);color:var(--vellum);letter-spacing:.02em;line-height:1.4;white-space:pre-line}

  /* ── firing deck ── */
  .deck{margin-top:12px;display:flex;gap:10px;align-items:flex-end}
  canvas#cyl{width:66px;height:66px;flex:none}
  .gauge-block{flex:1;min-width:0}
  .gauge-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:5px}
  .gauge-meta b{font-family:var(--mono);color:var(--vellum);font-weight:700}
  .combo{color:var(--brass);flex:none}
  .gauge{
    position:relative;height:44px;border:2px solid var(--line);border-radius:2px;
    background:repeating-linear-gradient(90deg,#1e1811 0 9px,#191410 9px 10px);
    cursor:pointer;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
  }
  .gauge::before,.gauge::after{
    content:'';position:absolute;top:0;bottom:0;width:8px;background:var(--panel-hi);
    border-right:2px solid var(--line);
  }
  .gauge::after{right:0;border-right:0;border-left:2px solid var(--line)}
  .silh{
    position:absolute;top:0;bottom:0;display:flex;pointer-events:none;
    border-left:1px solid rgba(230,220,196,.34);border-right:1px solid rgba(230,220,196,.34);
  }
  .silh .seg{
    position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;border-right:1px solid rgba(20,15,10,.45);
  }
  .silh .seg:last-child{border-right:0}
  .silh .seg i{
    font-style:normal;font-size:9px;font-family:var(--mono);letter-spacing:-.02em;
    color:rgba(230,220,196,.5);padding-bottom:2px;white-space:nowrap;
  }
  .silh.armored .seg:not(.head){filter:saturate(.15) brightness(.72)}
  .weak-mark{
    position:absolute;top:3px;bottom:3px;z-index:2;border:1px dashed rgba(224,169,60,.75);
    background:rgba(224,169,60,.12);box-shadow:inset 0 0 8px rgba(224,169,60,.18);
  }
  .weak-mark.found{
    border-style:solid;border-color:var(--blood);background:rgba(193,72,58,.28);
    box-shadow:0 0 9px rgba(193,72,58,.5);
  }
  .shot-marks{position:absolute;inset:0;pointer-events:none;z-index:3}
  .shot-mark{
    position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;
    background:var(--sand);box-shadow:0 0 4px rgba(201,161,115,.55);
  }
  .shot-mark.head{background:var(--blood);box-shadow:0 0 5px rgba(193,72,58,.7)}
  .shot-mark.weak{width:3px;background:var(--brass);box-shadow:0 0 6px rgba(224,169,60,.85)}
  .shot-mark.armor{background:var(--steel);box-shadow:none}
  .nock{
    position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;
    background:var(--vellum);box-shadow:0 0 10px rgba(230,220,196,.7);pointer-events:none;
  }
  .nock::before,.nock::after{
    content:'';position:absolute;left:-4.5px;width:12px;height:7px;background:var(--vellum);
    clip-path:polygon(50% 100%,0 0,100% 0);
  }
  .nock::before{top:-1px}
  .nock::after{bottom:-1px;transform:rotate(180deg)}
  .reload-veil{
    position:absolute;inset:0;background:rgba(10,8,6,.78);pointer-events:none;
    transform-origin:left;
  }
  .reload-veil span{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;font-size:11px;letter-spacing:.28em;color:var(--sand);
  }

  /* ── controls ── */
  .row{display:flex;gap:8px;min-width:0;margin-top:10px}
  button{
    font-family:var(--body);font-weight:700;color:var(--vellum);
    background:var(--panel);border:2px solid var(--line);border-radius:2px;
    cursor:pointer;transition:transform .06s,background .12s,border-color .12s;
  }
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .fire{flex:1;min-width:0;padding:14px;font-family:var(--display);font-size:18px;letter-spacing:.06em;background:#43301a;border-color:#7a5a26}
  .fire:hover{background:#503a20}
  .fire.go{background:#2f3a22;border-color:#6d8a3a;color:#dfeac2}
  .fire.go:hover{background:#3a4a2a}
  .reload{padding:14px 14px;font-size:13px;min-width:96px}
  .reload.urgent{border-color:var(--brass);color:var(--brass)}
  .focus{padding:10px 12px;font-size:12px;min-width:92px;color:#d8cda8}
  .focus.on{background:#443b20;border-color:var(--brass);color:#fff2b5;box-shadow:0 0 16px rgba(224,169,60,.28)}
  .focus:disabled{opacity:.34;cursor:not-allowed}
  .toggle{padding:14px 14px;font-size:13px;min-width:78px}
  .toggle.on{background:#3a2c16;border-color:var(--brass);color:var(--brass)}
  .toggle:disabled{opacity:.34;cursor:not-allowed}
  .snd{min-width:48px;font-size:15px}
  .lang{min-width:58px;padding:14px 10px;font-family:var(--mono);font-size:10px}

  /* ── shop ── */
  h2{
    font-family:var(--display);font-size:14px;letter-spacing:.14em;color:var(--dim);
    margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  h2 #shopState{float:right;font-family:var(--mono);font-size:10px;letter-spacing:.06em;font-weight:500}
  h2 #shopState.open{color:var(--brass)}
  h2 #shopState.shut{color:#6b5b45}
  .shop{display:grid;gap:8px;grid-template-columns:1fr;transition:opacity .18s}
  .shop.locked{opacity:.38}
  @media(min-width:620px){.shop{grid-template-columns:1fr 1fr}}
  .card{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:11px 12px;background:var(--panel);
  }
  .card:hover:not(:disabled){background:var(--panel-hi);border-color:var(--sand)}
  .card:disabled{opacity:.42;cursor:not-allowed}
  .card .lv{
    font-family:var(--mono);font-weight:700;font-size:12px;color:var(--brass);
    border:1px solid var(--line);padding:5px 6px;min-width:42px;text-align:center;flex:none;
  }
  .card .txt{flex:1;min-width:0}
  .card .nm{display:block;font-size:14px;font-weight:900;line-height:1.25}
  .card .ds{font-size:11px;color:var(--dim);line-height:1.35;margin-top:2px}
  .card .pr{font-family:var(--mono);font-size:12px;font-weight:700;flex:none}
  .card .pr.ok{color:var(--brass)}
  .card .pr.no{color:var(--blood)}

  .doctrine-head{
    display:flex;align-items:end;justify-content:space-between;gap:10px;
    margin-top:18px;margin-bottom:8px;
  }
  .doctrine-head h2{margin:0;flex:1}
  .doctrine-note{font-size:10px;color:var(--dim);line-height:1.4;text-align:right}
  .doctrines{display:grid;grid-template-columns:1fr;gap:8px}
  @media(min-width:620px){.doctrines{grid-template-columns:repeat(3,1fr)}}
  .doctrine-card{
    padding:11px 12px;text-align:left;min-height:96px;
    display:flex;flex-direction:column;gap:5px;
  }
  .doctrine-card:hover:not(:disabled){background:var(--panel-hi);border-color:var(--sand)}
  .doctrine-card.active{border-color:var(--brass);background:#332819}
  .doctrine-card:disabled:not(.active){opacity:.42;cursor:not-allowed}
  .doctrine-card b{font-size:13px;color:var(--vellum)}
  .doctrine-card span{font-size:10px;line-height:1.45;color:var(--dim)}
  .doctrine-card em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--brass)}
  .stats{
    margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--dim);
    line-height:1.9;border-top:1px solid var(--line);padding-top:10px;
  }
  .stats b{color:var(--vellum);font-weight:700}
  .focus-track{
    height:5px;margin:3px 0 5px;background:#17120d;border:1px solid var(--line);
    overflow:hidden;opacity:.72;
  }
  .focus-fill{
    width:100%;height:100%;background:var(--brass);transform-origin:left;
    transition:background .1s;
  }
  .focus-track.on{box-shadow:0 0 10px rgba(224,169,60,.45);opacity:1}
  .focus-track.on .focus-fill{background:#fff0a6}
  .savebar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);
  }
  .telemetry{
    display:none;align-items:center;justify-content:space-between;gap:14px;
    margin:0 0 12px;padding:12px 14px;border:1px solid rgba(201,161,115,.28);
    background:rgba(17,13,10,.72);font-family:var(--mono);font-size:11px;line-height:1.55;
  }
  .telemetry.show{display:flex}
  .telemetry-actions{display:flex;gap:8px;flex:0 0 auto}
  @media(max-width:620px){
    .telemetry{align-items:stretch;flex-direction:column}
    .row{gap:6px}
    .fire{padding:12px 7px;font-size:16px}
    .reload{min-width:78px;padding:12px 7px}
    .toggle{min-width:66px;padding:12px 7px}
    .snd{min-width:40px}
    .lang{min-width:42px;padding:12px 5px}
  }
  @media(max-width:350px){
    .row{flex-wrap:wrap}
    .fire{flex:1 1 calc(100% - 78px)}
    .focus{flex:0 0 72px;min-width:72px}
    .reload{flex:1 1 auto;min-width:0}
  }
  .slots{display:flex;gap:5px;flex-wrap:wrap}
  .slot{padding:6px 8px;min-width:88px}
  .slot.active{color:var(--brass);border-color:var(--brass);background:#2c2417}
  .save-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .mini{
    padding:5px 9px;font-size:10px;font-family:var(--mono);letter-spacing:.04em;
    background:transparent;border:1px solid var(--line);color:var(--dim);
  }
  .mini:hover{color:var(--vellum);border-color:var(--sand)}
  .mini.armed{color:var(--blood);border-color:var(--blood)}
  .intel-open{margin-top:7px;color:var(--sand)}
  .dossier{
    position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;
    background:rgba(10,8,6,.84);
  }
  .dossier.open{display:grid}
  .dossier-panel{
    width:min(620px,100%);max-height:min(78vh,680px);overflow:auto;
    border:2px solid var(--line);background:var(--panel);padding:16px;
    box-shadow:0 18px 60px #000;
  }
  .dossier-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .dossier-head h2{margin:0;border:0;padding:0;color:var(--brass)}
  .dossier-copy{font-size:11px;line-height:1.55;color:var(--dim);margin:9px 0 12px}
  .intel-list{display:grid;gap:7px}
  .intel-row{border:1px solid var(--line);padding:9px 10px;background:#1d1711}
  .intel-row.current{border-color:var(--brass)}
  .intel-row b{font-size:12px;color:var(--vellum)}
  .intel-row span{display:block;margin-top:3px;font-size:11px;color:var(--sand);line-height:1.45}
  .intel-row em{font-style:normal;color:var(--blood)}
  .intel-empty{font-size:12px;color:var(--dim);padding:16px 0;text-align:center}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <div class="title" id="gameTitle">최강의 <em>리볼버</em></div>
      <div class="sub">
        <span id="duelPrefix">제 </span><span id="stageNo">1</span><span id="duelSuffix"> 결투</span>
        &nbsp;·&nbsp; <b id="foeName">—</b>
      </div>
      <div class="chips" id="chips"></div>
      <button class="mini intel-open" id="intelBtn">현상금 목록 · 소문 0</button>
    </div>
    <div class="purse">
      <div class="k" id="bountyLabel">현 상 금</div>
      <div class="v" id="gold">0</div>
      <div class="st cold" id="expeditionTxt">마을 · 원정 준비</div>
      <div class="st cold" id="chainTxt">연쇄 0</div>
      <div class="st run" id="runTxt">사망 0 · 0:00</div>
    </div>
  </div>

  <div class="telemetry" id="telemetryPanel">
    <span id="telemetryCopy"></span>
    <div class="telemetry-actions">
      <button class="mini" id="telemetryYes"></button>
      <button class="mini" id="telemetryNo"></button>
    </div>
  </div>

  <div class="field-shell">
    <canvas id="field"></canvas>
    <div class="banner" id="banner"></div>
  </div>

  <div class="deck">
    <canvas id="cyl" title="실린더"></canvas>
    <div class="gauge-block">
      <div class="gauge-meta">
        <span id="aimLabel">조준선 — 급소에 겹치는 순간 격발</span>
        <span class="combo" id="comboTxt"></span>
      </div>
      <div class="focus-track" id="focusTrack" title="집중력">
        <div class="focus-fill" id="focusFill"></div>
      </div>
      <div class="gauge" id="gauge">
        <div class="silh" id="silh"></div>
        <div class="shot-marks" id="shotMarks"></div>
        <div class="nock" id="nock"></div>
        <div class="reload-veil" id="veil"><span id="reloadVeil">재 장 전</span></div>
      </div>
    </div>
  </div>

  <div class="row">
    <button class="fire" id="fireBtn"></button>
    <button class="focus" id="focusBtn">집 중 <span style="font-size:10px;opacity:.6">SHIFT</span></button>
    <button class="reload" id="reloadBtn">재장전 <span style="font-size:11px;opacity:.6">R</span></button>
    <button class="toggle snd on" id="sndBtn" title="격발음 켜기/끄기">♪</button>
    <button class="toggle lang" id="langBtn" title="언어 변경">EN</button>
  </div>

  <div class="doctrine-head">
    <h2 id="doctrineHeading">사격 교리&nbsp;/&nbsp; D O C T R I N E</h2>
    <div class="doctrine-note" id="doctrineNote"></div>
  </div>
  <div class="doctrines" id="doctrines"></div>

  <h2><span id="outfitHeading">장비&nbsp;/&nbsp; O U T F I T</span> <span id="shopState"></span></h2>
  <div class="shop" id="shop"></div>

  <div class="stats" id="stats"></div>

  <div class="savebar">
    <div class="slots" id="slots"></div>
    <div class="save-actions">
      <span id="saveState">—</span>
      <button class="mini" id="telemetryToggle"></button>
      <button class="mini" id="wipeBtn">현재 슬롯 삭제</button>
    </div>
  </div>
</div>

<div class="dossier" id="dossier" aria-hidden="true">
  <section class="dossier-panel" role="dialog" aria-modal="true" aria-labelledby="dossierTitle">
    <div class="dossier-head">
      <h2 id="dossierTitle">현 상 금 목 록 / 소 문</h2>
      <button class="mini" id="intelClose">닫기 ESC</button>
    </div>
    <p class="dossier-copy" id="dossierCopy">쓰러뜨린 총잡이가 다음 상대의 약점을 흘린다. 소문 없이 치명점을 맞혀도 현상금 목록에 기록된다.</p>
    <div class="intel-list" id="intelList"></div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('field'), ctx = cv.getContext('2d');
  const cc = $('cyl'), cx2 = cc.getContext('2d');
  let W = 0, H = 0, DPR = 1, CW = 0;
  const duelBackdrop = new Image();
  let duelBackdropReady = false;
  duelBackdrop.decoding = 'async';
  duelBackdrop.onload = () => { duelBackdropReady = true; };
  duelBackdrop.onerror = () => { duelBackdropReady = false; };
  duelBackdrop.src = 'assets/background-concepts/western-duel-bg-01.png';

  /* ───── language ───── */
  const LANGUAGE_KEY = 'revolver:language';
  const LANGUAGE = {
    ko: {
      pageTitle:'최강의 리볼버 v0.18',
      gameTitle:'최강의 <em>리볼버</em>',
      duelPrefix:'제 ', duelSuffix:' 결투',
      bounty:'현 상 금',
      cylinder:'실린더',
      aimDefault:'조준선 — 급소에 겹치는 순간 격발',
      focus:'집 중', reload:'재장전', reloadWide:'재 장 전',
      sound:'격발음 켜기/끄기', language:'언어 변경',
      doctrineHeading:'사격 교리&nbsp;/&nbsp; D O C T R I N E',
      outfitHeading:'장비&nbsp;/&nbsp; O U T F I T',
      telemetryCopy:'익명 플레이 데이터(진행·교리·결투 결과)를 보내 밸런스 개선을 돕습니다. 브라우저에 익명 플레이 ID를 저장하며 계정·광고 ID·기기 지문은 수집하지 않습니다.',
      telemetryYes:'익명 데이터 공유',

                center:{wins:0,losses:0,shots:0,crits:0},
                right:{wins:0,losses:0,shots:0,crits:0} },
    intel: {}, discovered: {},
    ammo: 6, ammoStart: 6, reload: 0, cool: 0, focus: 0,
    cursor: 0, dir: 1, bodyX: 0.5,
    bleed: 0, bleedT: 0,
    phase: 'standoff', pt: 1.6, drawAt: 0, firstStrike: false,
    doctrine: 'precision', doctrineChosen: false, doctrineStats: {},
    betweenWin: true, bLock: 0, pendingRumor:'', pendingMastery:'',
    expedition: emptyExpedition(), expeditionResult: emptyExpeditionResult(), reloadLoad: 0,
    foe: Object.assign({}, BLANK_FOE), foeAim: 0, aimDur: 2.7,

    shake: 0, flash: 0, red: 0, recoil: 0, foeRecoil: 0, fall: 0, zoneFlash: 0
  };
  const F = () => S.foe;

  /* ───── derived ───── */
  // 동료 4명이 사라진 만큼 한 발의 무게를 그대로 옮겨왔다 (10 × 3.2)
  const dmgPerShot = () => 32 * Math.pow(1.25, S.lvl.dmg);
  // 몸 지도 — 왼쪽이 머리, 오른쪽이 발. w는 몸 창 안에서의 비율(합 1.00)
  const BODY = [
    { id:'head',  name:bilingual('머리','Head'), w:0.15, mult:6.00, y:0.83, col:'#c1483a' },
    { id:'shldr', name:bilingual('어깨','Shoulder'), w:0.13, mult:1.50, y:0.72, col:'#c9a173' },
    { id:'chest', name:bilingual('가슴','Chest'), w:0.20, mult:2.60, y:0.62, col:'#d4703f' },
    { id:'belly', name:bilingual('배','Belly'), w:0.22, mult:1.00, y:0.48, col:'#c9a173' },
    { id:'legs',  name:bilingual('다리','Legs'), w:0.30, mult:0.35, y:0.22, col:'#8b8f88' }
  ];
  const bodyPart = id => BODY.find(p => p.id === id);
  const bodyPartStart = id => {
    let a = 0;
    for(const p of BODY){ if(p.id === id) return a; a += p.w; }
    return 0;
  };
  function weakPointFor(stage, nick=foeNick(stage)){
    const profile = WEAK_PROFILES[nick] || WEAK_PROFILES['재수없는'];
    const part = bodyPart(profile.part);
    const width = Math.min(0.052, part.w * 0.42);
    const pad = Math.min(0.012, Math.max(0, (part.w-width)/3));
    const room = Math.max(0, part.w - width - pad*2);
    const start = bodyPartStart(part.id) + pad + hash(stage*17.17 + 4.2) * room;
    return { part:part.id, name:profile.name, clue:profile.clue, start, width };
  }
  const clearedBosses = () => Math.max(0, Math.floor(S.checkpoint / 5));
  // 현상금 두목 하나를 넘을 때마다 모든 총잡이에게 통하는 머리 사격이 강해진다.
  const headMult = () => 6 + clearedBosses();
  // 소문으로 찾은 작은 치명점은 성장한 머리 사격의 두 배. 패닝으로는 발동하지 않는다.
  const weakMult = () => headMult() * 2;
  // 몸 사격은 두목을 넘을수록 완만히 성장한다. 머리의 폭발력은 넘지 않는다.
  const bodyMastery = () => Math.min(2.5, 1 + clearedBosses() * 0.12);
  const bodyMult = part => part ? part.mult * bodyMastery() : 0;
  // 조준경: 표적이 크게 보인다 — 몸 창 전체가 넓어지고 부위 비율은 그대로
  const bodyW = () => 0.26 + 0.047 * S.lvl.gauge;
  const headW = () => bodyW() * BODY[0].w;
  const headCenter = () => S.bodyX - bodyW()/2 + headW()/2;
  // 커서 위치가 어느 부위인지. 몸 창을 벗어나면 null(허공)
  function partAt(c){
    const w = bodyW(), u = (c - (S.bodyX - w/2)) / w;
    if(u < 0 || u > 1) return null;
    let a = 0;
    for(const p of BODY){ a += p.w; if(u <= a) return p; }
    return BODY[BODY.length-1];
  }
  function weakAt(c){
    const q = F().weak, w = bodyW();
    if(!q || w <= 0) return false;
    const u = (c - (S.bodyX - w/2)) / w;
    return u >= q.start && u <= q.start + q.width;
  }
  const bodyUAt = c => (c - (S.bodyX - bodyW()/2)) / bodyW();
  function nearWeakAt(c){
    if(!S.intel[F().stage] || weakAt(c) || !F().weak) return false;
    const q = F().weak, u = bodyUAt(c), p = partAt(c);
    if(!p || p.id !== q.part) return false;
    const pad = Math.min(0.018, q.width * 0.5);
    return u >= q.start - pad && u <= q.start + q.width + pad;
  }
  const nearWeakMult = part => Math.max(bodyMult(part), headMult() * 0.55);
  const shotGap  = () => Math.max(0.13, 0.40 * Math.pow(0.90, S.lvl.trigger));
  // 패닝 — 왼손으로 공이치기를 연타하는 속사. 격발 훈련이 물량 빌드의 정체성이 된다.
  const fanGap   = () => Math.max(0.06, shotGap() * 0.45);
  const FOCUS_CHARGE = 0.70;
  const focusUses = () => 1 + S.lvl.focusUses;
  const focusMax = () => FOCUS_CHARGE * focusUses();
  // 무한히 올려도 0에 닿지 않는 점근식. Lv0 38% → Lv1 33% → Lv4 22%.
  const focusSpeed = () => {
    const base = 0.10 + 0.28 * Math.pow(0.82, S.lvl.focusSlow);
    return S.doctrine === 'precision' ? base * 0.88 : base;
  };
  const focusPct = () => Math.round(focusSpeed() * 100);
  const focusUsesLeft = () => Math.ceil(Math.max(0, S.focus) / FOCUS_CHARGE);
  const reloadT  = () => Math.max(0.80, 2.40 * Math.pow(0.88, S.lvl.reload));
  // 공이치기 아래 한 칸은 비워두고 다녔다 — 5발로 시작한다
  const capacity = () => 5 + S.lvl.cyl;
  const reserveCapacity = () => capacity() * 3;
  // 나와 적은 같은 규칙으로 싸운다 — 양쪽 다 체력 숫자를 갖는다
  const maxHp    = () => Math.floor(100 * Math.pow(1.25, S.lvl.hp));
  const armorMax = () => S.lvl.vest;   // 가죽 코트 — 피해 크기와 무관하게 한 발을 통째로 막는다
  // v0.17: 권장 체력 투자 시 일반탄 한 발은 버티되 대구경·재장전 피격은 위험하게 남긴다.
  const foeDmg   = () => 34 * Math.pow(1.465, S.stage - 1);
  // 머리 창(headW × sweepT)이 55ms 밑으로 내려가지 않도록 커서를 붙잡는다.
  // 사람의 예측 타이밍 오차가 σ 20~40ms라, 그 밑은 실력이 아니라 운이 된다.
  const sweepT   = () => Math.max(0.30, (1.05 - (S.stage-1)*0.013) * F().sweepMul, 0.055/headW());
  const foeAimT  = () => Math.max(0.55, (2.70 - (S.stage-1)*0.055) * F().aimMul);
  const hunchBonus= () => S.lvl.hunch * 0.10;
  const doctrineDrawBonus = () => S.doctrine === 'duelist' ? 0.06 : 0;
  const drawBonus = () => hunchBonus() + doctrineDrawBonus();
  // 하한 0.20초는 상대가 뽑는 속도의 한계 — 예감은 그 위에 얹히는 여유다
  const foeDrawT = () => Math.max(0.20, (0.95 - (S.stage-1)*0.018) * F().drawMul) + drawBonus();
  const comboMulAt = step => Math.min(3, 1 + Math.min(S.combo, 25) * step);
  const comboMul = () => comboMulAt(S.doctrine === 'duelist' ? 0.12 : 0.08);
  // 연쇄: 빗나가지 않고 이어온 급소의 수. 결투를 넘어 누적되고, 빗나감과 사망에만 끊긴다.
  const chainMul = () => Math.min(4, 1 + S.chain * 0.05);
  const isRewind = () => S.stage < S.bestStage;
  // 장비는 원정을 마치고 마을에 돌아왔을 때만 만질 수 있다.
  const shopOpen = () => S.phase === 'between' && !S.expedition.active;
  const stageHp  = s => Math.floor(100 * Math.pow(1.55, s - 1));
  const clearGold= s => Math.floor(28 * Math.pow(1.72, s - 1));

  function clock(ms){
    const t = Math.floor(ms/1000), h = Math.floor(t/3600),
          m = Math.floor(t%3600/60), sec = t%60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
             : `${m}:${String(sec).padStart(2,'0')}`;
  }

  function fmt(n){
    if(n < 1000) return (n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n)).toString();
    const u = ['K','M','B','T','Qa','Qi','Sx'];
    let i = -1;
    while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
    return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
  }

  /* ───── 사운드 (WebAudio 합성 — 외부 파일 없음) ───── */
  const SFX = { on:true, ac:null, master:null, noise:null };
  function audio(){
    if(SFX.ac) return SFX.ac;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      SFX.ac = new AC();
      SFX.master = SFX.ac.createGain();
      SFX.master.gain.value = 0.5;
      SFX.master.connect(SFX.ac.destination);
      const len = Math.floor(SFX.ac.sampleRate * 0.4);
      SFX.noise = SFX.ac.createBuffer(1, len, SFX.ac.sampleRate);
      const d = SFX.noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    }catch(e){ SFX.ac = null; }
    return SFX.ac;
  }
  function wake(){
    const c = audio();
    if(c && c.state === 'suspended') c.resume().catch(()=>{});
  }
  function burst(t, {cut, cutEnd, gain, dur, type}){
    const c = SFX.ac, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = SFX.noise;
    f.type = type || 'lowpass';
    f.frequency.setValueAtTime(cut, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, cutEnd), t + dur);
    if(f.type === 'bandpass') f.Q.value = 6;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
    src.connect(f); f.connect(g); g.connect(SFX.master);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function tone(t, f0, f1, gain, dur, type){
    const c = SFX.ac, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
    o.connect(g); g.connect(SFX.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxShot(strong){
    if(!SFX.on || !audio() || SFX.ac.state !== 'running') return;
    const t = SFX.ac.currentTime;
    burst(t, { cut: strong?5400:3600, cutEnd:280, gain: strong?0.52:0.36, dur: strong?0.28:0.20 });
    tone(t, strong?135:115, 50, strong?0.46:0.32, 0.16);
  }
  function sfxFan(){
    if(!SFX.on || !audio() || SFX.ac.state !== 'running') return;
    const t = SFX.ac.currentTime;
    burst(t, { cut:3000, cutEnd:240, gain:0.26, dur:0.12 });
    tone(t, 120, 55, 0.20, 0.08);
  }
  function sfxHit(){
    if(!SFX.on || !audio() || SFX.ac.state !== 'running') return;
    const t = SFX.ac.currentTime;
    burst(t, { cut:1100, cutEnd:120, gain:0.42, dur:0.34 });
    tone(t, 82, 34, 0.5, 0.30);

  function sfxReload(){
    if(!SFX.on || !audio() || SFX.ac.state !== 'running') return;
    const t = SFX.ac.currentTime;
    burst(t,        { cut:2400, cutEnd:1400, gain:0.20, dur:0.05, type:'bandpass' });

  }

  let shopDirty = true, chipsDirty = true, intelDirty = true, silKey = '', shopWasOpen = null;
  function renderShop(){

    $('shop').className = 'shop' + (open ? '' : ' locked');
    $('shop').innerHTML = SHOP.map(u => {
      const locked = u.unlock && !u.unlock();
      const done = !u.can();
      const c = u.cost(), afford = S.gold >= c;
      return `<button class="card" data-id="${u.id}" ${locked||done||!afford||!open?'disabled':''}>
        <span class="lv">${u.lv()}</span>
        <span class="txt"><span class="nm">${localText(u.name)}</span><span class="ds">${localText(u.ds())}</span></span>
        <span class="pr ${afford&&!locked?'ok':'no'}">${locked?localText(bilingual('잠김','LOCKED')):done?'MAX':fmt(c)}</span>
      </button>`;
    }).join('');
    $('shop').querySelectorAll('.card').forEach(b => b.onclick = () => {
      const u = SHOP.find(x => x.id === b.dataset.id);
      const c = u.cost();
      if(!shopOpen() || (u.unlock && !u.unlock()) || !u.can() || S.gold < c) return;

  let dossierOpen = false;

  /* ───── geometry (side view) ───── */

  /* ───── entities ───── */
  const tracers = [], parts = [], texts = [], shotMarks = [];
  const weeds = [{x:-1,y:0,r:0,sp:0,rot:0}];

  // 패닝 홀드 상태 — 저장하지 않는 순수 런타임 입력 상태
  let ptrHeld = false, keyHeld = false, holdArmed = false, holdT = 0, fanning = false;
  let focusPtrHeld = false, focusKeyHeld = false, focusing = false;
  let focusWasActive = false;
  const canFocus = () =>
    S.doctrine === 'precision' && S.phase === 'fight' &&
    S.reload <= 0 && !fanning && S.focus > 0;
  const emptyPartStat = () => ({ shots:0, damage:0, control:0 });
  const emptyDirStat = () => ({ shots:0, hits:0, head:0, weak:0 });
  const emptyPosStat = () => ({ wins:0, losses:0, shots:0, crits:0 });
  const targetZone = () => S.bodyX < 0.38 ? 'left' : S.bodyX > 0.62 ? 'right' : 'center';
  const dirKey = () => S.dir > 0 ? 'right' : 'left';
  function ensureCombatStats(){
    if(!S.dirStats || typeof S.dirStats !== 'object') S.dirStats = {};
    S.dirStats.right = Object.assign(emptyDirStat(), S.dirStats.right);
    S.dirStats.left = Object.assign(emptyDirStat(), S.dirStats.left);
    if(!S.partStats || typeof S.partStats !== 'object') S.partStats = {};
    BODY.forEach(p => { S.partStats[p.id] = Object.assign(emptyPartStat(), S.partStats[p.id]); });
    if(!S.posStats || typeof S.posStats !== 'object') S.posStats = {};
    ['left','center','right'].forEach(k => {
      S.posStats[k] = Object.assign(emptyPosStat(), S.posStats[k]);
    });
    S.focusActivations = Math.max(0, S.focusActivations|0);
    if(!S.doctrineStats || typeof S.doctrineStats !== 'object') S.doctrineStats = {};
    DOCTRINES.forEach(d => {
      S.doctrineStats[d.id] = Object.assign(emptyDoctrineStat(), S.doctrineStats[d.id]);
    });
  }
  function addShotMark(u, kind){
    if(!Number.isFinite(u)) return;
    shotMarks.push({ u:Math.max(0,Math.min(1,u)), kind, t:0, max:4 });
    if(shotMarks.length > 8) shotMarks.shift();
  }
  function recordAimedShot(part, weak, near, u){
    ensureCombatStats();
    const d = S.dirStats[dirKey()];
    d.shots++;
    const z = S.posStats[targetZone()];
    z.shots++;
    if(part){
      d.hits++;
      S.partStats[part.id].shots++;
      if(part.id === 'head') d.head++;
      if(weak) d.weak++;
      if(weak || part.id === 'head') z.crits++;
    }
    return { u, kind:weak ? 'weak' : part && part.id === 'head' ? 'head' : near ? 'near' : 'body' };
  }
  function addPartDamage(part, damage){
    if(!part || damage <= 0) return;
    ensureCombatStats();
    S.partStats[part.id].damage += damage;
  }
  function addControl(part, amount=1){
    if(!part) return;
    ensureCombatStats();
    S.partStats[part.id].control += amount;
  }

  // 상대가 서 있는 자리는 결투 동안 변하지 않는다. 적마다 다를 뿐이다.
  function placeBody(){
    const pad = bodyW()/2 + 0.015;
    S.bodyX = pad + Math.random() * Math.max(0, 1 - pad*2);
    S.zoneFlash = 1;
  }

  let msgS = '', msgT = 0;
  const msg = (t, dur) => { msgS = t; msgT = dur || 1.6; };

  function buildFoe(s){
    const f = Object.assign({}, BLANK_FOE);
    f.stage = s;
    f.nick = foeNick(s);
    f.name = foeName(s);
    f.weak = weakPointFor(s, f.nick);
    f.boss = s % 5 === 0;
    f.traits = traitsFor(s);
    f.traits.forEach(t => {
      if(t.aim)     f.aimMul  *= t.aim;
      if(t.hp)      f.hpMul   *= t.hp;
      if(t.draw)    f.drawMul *= t.draw;
      if(t.sweep)   f.sweepMul*= t.sweep;
      if(t.bodyRes) f.bodyRes *= t.bodyRes;
      if(t.heavy)   f.heavy   += t.heavy;
      if(t.dodge)   f.dodge    = Math.max(f.dodge, t.dodge);
      if(t.jitter)  f.jitter   = Math.max(f.jitter, t.jitter);
      if(t.armor)   f.armor   += t.armor;
    });
    // 두목은 좋은 장비를 입고 있다
    if(f.boss){ f.hpMul *= 2; f.armor += 1 + Math.floor(s/20); }
    f.scale = (f.boss ? 1.12 : 1) * (f.hpMul > 1.4 ? 1.10 : f.hpMul < 0.9 ? 0.93 : 1);
    return f;
  }

  function resetFoeAim(){
    const j = F().jitter;
    S.aimDur = Math.max(0.25, foeAimT() * (1 + (Math.random()-0.5)*2*j));
    S.foeAim = 0;
  }

  let duelTelemetry = null;
  function duelTelemetryPayload(result){
    const f = F();
    const d = duelTelemetry || {};
    return {
      result,
      duration_ms:Math.max(0, Math.round(performance.now() - (d.startedAt || performance.now()))),
      doctrine:S.doctrine,
      boss:!!f.boss,
      trait_ids:f.traits.map(trait => trait.id),
      aimed_shots:d.aimedShots || 0,
      fan_shots:d.fanShots || 0,
      aimed_hits:d.aimedHits || 0,
      reloads:d.reloads || 0,
      focus_ms:Math.round(d.focusMs || 0),
      damage_taken:d.damageTaken || 0,
      armor_blocks:d.armorBlocks || 0,
      draw_ms:Number.isFinite(d.drawMs) ? Math.round(d.drawMs) : null,
      draw_won:typeof d.drawWon === 'boolean' ? d.drawWon : null,
      player_hp:Math.max(0, Math.round(S.hp)),
      enemy_hp:Math.max(0, Math.round(S.foeHp))
    };
  }

  function topOffCylinder(){
    const need = Math.max(0, capacity() - S.ammo);
    const load = Math.min(need, Math.max(0, S.expedition.reserveAmmo|0));
    S.ammo += load;
    S.expedition.reserveAmmo -= load;
    S.ammoStart = S.ammo;
    return load;
  }

  function prepareTownResources(){
    S.hp = maxHp();
    S.armor = armorMax();
    S.ammo = capacity();
    S.ammoStart = S.ammo;
    S.reload = 0; S.reloadLoad = 0;
    S.focus = focusMax();
    S.expedition.reserveAmmo = reserveCapacity();
  }

  function startExpedition(){
    S.expedition = {
      active:true, kills:0, reserveAmmo:reserveCapacity(),
      securedGold:0, carriedGold:0, startStage:S.stage
    };

  function finishExpedition(survived, deferTown=false){
    const e = S.expedition;

      const secured = Math.max(0, Math.floor(e.securedGold));
      const carried = Math.max(0, Math.floor(e.carriedGold));

      const lost = survived ? 0 : carried;

      S.chain = 0;
    }

    prepareTownResources();
    S.phase = 'between';
    S.betweenWin = survived;
    S.bLock = 0.6;
    shopDirty = true; chipsDirty = true;

  function returnToTown(){

  function enterTownReady(preserveResult=false){

  function newDuel(resuming=false){

    S.pendingRumor = '';
    S.pendingMastery = '';
    S.foe = buildFoe(S.stage);
    S.foeMaxHp = Math.floor(stageHp(S.stage) * F().hpMul);
    S.foeHp = S.foeMaxHp;
    S.hp = Math.max(1, Math.min(maxHp(), S.hp));
    S.armor = armorMax(); S.foeArmor = F().armor; S.combo = 0;
    S.ammo = Math.max(0, Math.min(capacity(), S.ammo|0)); S.ammoStart = S.ammo;
    S.reload = 0; S.reloadLoad = 0; S.cool = 0; S.bleed = 0; S.bleedT = 0;
    S.firstStrike = false; S.fall = 0;
    holdArmed = false; holdT = 0; fanning = false;
    focusPtrHeld = false; focusKeyHeld = false; focusing = false; focusWasActive = false; S.focus = focusMax();
    S.phase = 'standoff';
    S.pt = isRewind() ? 0.25 : 1.1 + Math.random()*1.7;
    resetFoeAim();
    placeBody();
    shotMarks.length = 0;
    duelTelemetry = {
      startedAt:performance.now(), aimedShots:0, fanShots:0, aimedHits:0,
      reloads:0, focusMs:0, damageTaken:0, armorBlocks:0,
      drawMs:null, drawWon:null
    };

  /* ───── the draw ───── */
  function drawOpeningShot(label){
    S.phase = 'fight';
    resetFoeAim();
    msg(label, 1.4);
    const part = BODY.find(p => p.id === 'chest');
    S.doctrineStats[S.doctrine].drawShots++;
    bang(dmgPerShot(), part, true, false, false, false);
    S.ammo--; S.cylTarget++; S.recoil = 1;
    S.cool = shotGap();
    if(S.ammo <= 0 && S.phase === 'fight') startReload();
  }
  function rewindStart(){
    drawOpeningShot(localText(bilingual('되감기 · 확정 선제탄','Rewind · Guaranteed opening shot')));
  }
  function earlyDraw(){
    S.phase = 'fight'; S.cool = 0.8; resetFoeAim();
    msg(localText(bilingual('성급했다 — 손이 굳었다','Too soon — your hand freezes')));
    foeFire(false);
  }
  function resolveDraw(timeout){
    const rt = (performance.now() - S.drawAt) / 1000;
    const win = !timeout && rt <= foeDrawT();
    if(duelTelemetry){
      duelTelemetry.drawMs = rt * 1000;
      duelTelemetry.drawWon = win;
    }
    if(win){
      if(!S.bestDraw || rt < S.bestDraw) S.bestDraw = rt;
      const g = rt < 0.20
        ? localText(bilingual('신 의 손','GOD HAND'))
        : rt < 0.33 ? localText(bilingual('번 개 처 럼','LIGHTNING FAST'))
        : localText(bilingual('간 발 의 차','BY A HAIR'));
      drawOpeningShot(currentLanguage === 'ko'
        ? `${g} · ${(rt*1000).toFixed(0)}ms — 확정 선제탄`
        : `${g} · ${(rt*1000).toFixed(0)}ms — guaranteed opening shot`);
    } else {
      S.phase = 'fight'; resetFoeAim();
      msg(timeout
        ? localText(bilingual('뽑기가 늦었다','Too slow on the draw'))
        : currentLanguage === 'ko'
          ? `${(rt*1000).toFixed(0)}ms — 상대가 빨랐다`
          : `${(rt*1000).toFixed(0)}ms — the enemy was faster`);
      foeFire(false);
    }
  }

  /* ───── shooting ───── */
  function startReload(){
    if(S.phase !== 'fight' || S.reload > 0 || S.ammo >= capacity()) return;
    const rounds = Math.min(capacity() - S.ammo, Math.max(0, S.expedition.reserveAmmo|0));
    if(rounds <= 0){
      msg(localText(bilingual('예비 탄약이 없다 — 살아서 마을로 돌아가야 한다','No reserve ammo — make it back to town alive')), 1.6);
      return;
    }
    if(duelTelemetry) duelTelemetry.reloads++;
    focusPtrHeld = false; focusKeyHeld = false; focusing = false;
    S.ammoStart = S.ammo;
    S.reloadLoad = rounds;
    S.expedition.reserveAmmo -= rounds;
    S.reload = reloadT();
  }

  function shoot(){
    if(S.phase !== 'fight' || S.reload > 0 || S.cool > 0) return;
    if(S.ammo <= 0){ startReload(); return; }

    let part, mult, sure = false, graze = false, weak = false, near = false, shotRecord = null;
    if(S.firstStrike){
      // 선제 사격은 성장한 머리 피해를 확정하고, 숨은 치명점까지 대신 찾지는 않는다.
      part = BODY[0]; mult = headMult() * 2; sure = true; S.firstStrike = false;
      S.combo++; S.chain++; S.crits++;
      // 확정 선제 사격은 방향 숙련 통계에서 제외하고 학습 눈금만 남긴다.
      shotRecord = { u:BODY[0].w/2, kind:'head' };
    } else {
      part = partAt(S.cursor);
      weak = !!part && weakAt(S.cursor);
      near = !!part && nearWeakAt(S.cursor);
      mult = weak ? weakMult()
        : part && part.id === 'head' ? headMult()
        : near ? nearWeakMult(part)
        : bodyMult(part);
      // 머리와 숨은 치명점은 연속·연쇄를 쌓고, 허공만 끊는다.
      if(weak || (part && part.id === 'head')){ S.combo++; S.chain++; S.crits++; }
      else if(!part){
        // 몸 창 가장자리를 스친 빗나감은 연쇄를 끊지 않는다 — 쌓이지도 않는다.
        // 머리가 몸 창의 끝이라, 같은 20ms 실수가 한쪽은 어깨(x1.5)
        // 반대쪽은 연쇄 전체 소멸이 되는 비대칭을 여기서 눅인다.
        const w = bodyW(), m = headW() * 0.6;
        const dL = (S.bodyX - w/2) - S.cursor, dR = S.cursor - (S.bodyX + w/2);
        graze = (dL > 0 && dL < m) || (dR > 0 && dR < m);
          if(!graze){ S.combo = 0; S.chain = 0; }
        }
      shotRecord = recordAimedShot(part, weak, near, bodyUAt(S.cursor));
    }
    S.shots++;
    if(duelTelemetry){
      duelTelemetry.aimedShots++;
      if(part) duelTelemetry.aimedHits++;
    }
    S.bestCombo = Math.max(S.bestCombo, S.combo);
    S.bestChain = Math.max(S.bestChain, S.chain);

    const ds = S.doctrineStats[S.doctrine];
    const critical = weak || (part && part.id === 'head');
    if(focusing && critical && S.doctrine === 'precision'){
      ds.focusCrits++;
      S.focus = Math.min(focusMax(), S.focus + 0.08);
    }
    const baseDamage = dmgPerShot() * mult;
    if(S.doctrine === 'duelist')
      ds.comboBonus += Math.max(0, baseDamage * (comboMul() - comboMulAt(0.08)));
    bang(baseDamage * comboMul(), part, sure, graze, weak, false, shotRecord, near);

    S.ammo--; S.cylTarget++; S.recoil = 1;
    S.cool = shotGap();
    if(weak || (part && part.id === 'head')) S.flash = 1;
    if(S.ammo <= 0) startReload();
  }

  // 패닝 — 격발을 누르고 있으면 왼손으로 공이치기를 연타한다.
  // 부위는 무작위(몸 창 밖으로도 샌다). 연속·연쇄를 쌓지도, 끊지도 않는다.
  // 아머 벗기기와 몸통 깎기용 — 머리 창을 노릴 수 없는 상대에 대한 답이다.
  const FAN_SPILL = 0.15;   // 몸 창 양옆으로 새는 폭 (몸 창 대비 비율)
  function fanShot(){
    if(S.phase !== 'fight' || S.reload > 0) return;
    if(S.ammo <= 0){ startReload(); fanning = false; holdArmed = false; return; }
    const u = -FAN_SPILL + Math.random() * (1 + FAN_SPILL*2);
    let part = null;
    if(u >= 0 && u <= 1){
      let a = 0;
      for(const p of BODY){ a += p.w; if(u <= a){ part = p; break; } }
      if(!part) part = BODY[BODY.length-1];
    }
    S.fanShots++;
    if(duelTelemetry){
      duelTelemetry.fanShots++;
      if(part) duelTelemetry.aimedHits++;
    }
    // 콤보 배율 없음 — 패닝은 물량이지 정밀이 아니다
    bang(dmgPerShot() * bodyMult(part), part, false, false, false, true);
    S.ammo--; S.cylTarget++;
    S.cool = fanGap();
    if(S.ammo <= 0){ startReload(); fanning = false; holdArmed = false; }
  }

  function bang(dmg, part, sure, graze, weak, fan, shotRecord, near){
    const f0 = F(), m = muzzle(), f = foePos();
    const head = !!part && part.id === 'head';
    const critical = head || weak;
    const dodged = !sure && !weak && f0.dodge > 0 && Math.random() < f0.dodge;

    // 방탄 조끼는 머리와 소문으로 알아낸 치명점을 막지 못한다
    if(!critical) dmg *= f0.bodyRes;

    const spread = part ? f.h*0.12 : f.h*0.55;
    const tx = f.x + (Math.random()-0.5)*spread;
    // 맞은 부위의 높이에 그대로 탄착한다
    const ty = part
      ? f.foot - f.h*(part.y + (Math.random()-0.5)*0.06)
      : f.foot - f.h*(0.50 + Math.random()*0.55);

    tracers.push({ x0:m.x, y0:m.y, x1:tx, y1:ty, t:0, max:0.055, c:'#f5dfa2' });
    S.recoil = fan ? 0.7 : 1;
    fan ? sfxFan() : sfxShot(critical);

    if(!part){
      // 빗나간 총알은 피해를 주지 않는다 — 콤보가 끊기는 것으로 충분하다
      texts.push({ x:tx, y:ty, t:0, s:graze
        ? localText(bilingual('스침','GRAZE'))
        : localText(bilingual('빗나감','MISS')), c:'#7f8c96' });
      S.shake = 1.2;
      for(let i=0;i<7;i++){
        const a = -Math.PI*(0.12 + Math.random()*0.76), sp = 28 + Math.random()*74;
        parts.push({ x:tx, y:ty, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
          t:0, max:0.4+Math.random()*0.45, r:1+Math.random()*1.8, c:'#6d5b43' });
      }
      return;
    }
    if(dodged){
      texts.push({ x:tx, y:ty, t:0, s:localText(bilingual('흘렸다','EVADED')), c:'#7f8c96' });
      S.shake = 1;
      return;
    }
    if(S.foeArmor > 0){
      const beforeArmor = S.foeArmor;
      const armorDamage = fan && S.doctrine === 'suppressor' ? 2 : 1;
      S.foeArmor = Math.max(0, S.foeArmor - armorDamage);
      if(fan) S.doctrineStats[S.doctrine].fanArmor += beforeArmor - S.foeArmor;
      const broken = S.foeArmor <= 0;
      texts.push({ x:tx, y:ty, t:0, s:broken
        ? localText(bilingual('코트 파괴','COAT BROKEN'))
        : localText(bilingual('완전 방어','BLOCKED')), c:'#9fb0bd' });
      if(shotRecord) addShotMark(shotRecord.u, 'armor');
      S.shake = broken ? 7 : 3; sfxArmor();
      if(broken) msg(localText(bilingual('상대의 코트를 벗겼다 — 이제 피해가 들어간다','Enemy coat stripped — shots will now deal damage')), 1.2);
      return;
    }

    const hpBefore = S.foeHp;
    S.foeHp -= dmg;
    addPartDamage(part, Math.min(hpBefore, dmg));
    S.shake = weak ? 12 : head ? 8 : 2 + part.mult*1.4;

    const col = part.col;
    const freshWeak = weak ? discoverWeakPoint() : false;
    const pre = weak ? `${localText(bilingual('치명점','VITAL'))} · ${localText(f0.weak.name)} `
      : near ? `${localText(bilingual('상처 스침','WOUND GRAZE'))} · ${localText(part.name)} `
      : (!head && f0.bodyRes < 1) ? `${localText(bilingual('조끼 경감','VEST REDUCED'))} · ${localText(part.name)} `
      : localText(part.name) + ' ';
    texts.push({ x:tx, y:ty, t:0, s:pre+fmt(dmg), c:col });
    if(shotRecord) addShotMark(shotRecord.u, shotRecord.kind);
    if(freshWeak) msg(currentLanguage === 'ko'
      ? `알아냈다 — ${foeDisplayName(f0)}의 치명점은 ${localText(f0.weak.name)}`
      : `Discovered — ${foeDisplayName(f0)}’s vital point is ${localText(f0.weak.name)}`, 2.4);

    // 몸 부위는 낮은 피해 대신 전투 시간을 벌거나 안정 피해를 남긴다.
    if(!head && !weak && part.id === 'shldr'){
      const suppression = S.doctrine === 'suppressor' ? 0.32 : 0.18;
      S.foeAim = Math.max(0, S.foeAim - suppression);
      S.doctrineStats[S.doctrine].suppressMs += suppression * S.aimDur * 1000;
      addControl(part);
      texts.push({ x:tx, y:ty-16, t:0, s:localText(bilingual('조준 제압','AIM SUPPRESSED')), c:'#e0a93c' });
    } else if(!head && !weak && part.id === 'legs'){
      const delay = S.doctrine === 'suppressor' ? 1.28 : 1.15;
      S.aimDur = Math.min(foeAimT()*1.65, S.aimDur*delay);
      S.doctrineStats[S.doctrine].legDelays++;
      addControl(part);
      texts.push({ x:tx, y:ty-16, t:0, s:localText(bilingual('다음 발 지연','NEXT SHOT DELAYED')), c:'#e0a93c' });
    } else if(!head && !weak && part.id === 'belly'){
      S.bleed += dmg * 0.35;
      S.bleedT = Math.max(S.bleedT, 1.5);
      addControl(part);
      texts.push({ x:tx, y:ty-16, t:0, s:localText(bilingual('출혈','BLEEDING')), c:'#c1483a' });
    }

    const n = weak ? 28 : head ? 20 : 7 + Math.round(part.mult*2);
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = 25 + Math.random()*100;
      parts.push({ x:tx, y:ty, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        t:0, max:0.35+Math.random()*0.5, r:1+Math.random()*2.2,
        c: Math.random()<0.35 ? col : '#6d5b43' });
    }
    if(S.foeHp <= 0) foeDown();
    shopDirty = true;
  }

  function foeFire(){
    const f0 = F(), m = foeMuzzle(), p = playerPos();
    tracers.push({ x0:m.x, y0:m.y, x1:p.x + p.h*0.06, y1:p.foot - p.h*0.60,
                   t:0, max:0.07, c:'#ffb9a0' });
    S.foeRecoil = 1;
    const heavy = f0.heavy > 0, exposed = S.reload > 0;
    const px = playerPos().x, py = playerPos().foot - playerPos().h*0.62;
    if(S.armor > 0){
      if(duelTelemetry) duelTelemetry.armorBlocks++;
      S.armor--;
      S.shake = 5; sfxArmor();
      texts.push({ x:px, y:py, t:0, s:S.armor
        ? localText(bilingual('코트가 막았다','COAT BLOCKED'))
        : localText(bilingual('코트 소진','COAT SPENT')), c:'#c9a173' });
      if(S.armor <= 0) msg(localText(bilingual('가죽 코트가 모두 찢어졌다','Your leather coat is torn to pieces')), 1.2);
      resetFoeAim();
      return;
    }
    const mult = (heavy ? 2 : 1) * (exposed ? 1.5 : 1);
    const hurt = Math.floor(foeDmg() * mult);
    if(duelTelemetry) duelTelemetry.damageTaken += hurt;
    S.hp -= hurt;
    S.red = 1; S.shake = 8 + mult*4; S.combo = 0;
    sfxHit();
    texts.push({ x:px, y:py, t:0, s:'-'+fmt(hurt), c:'#c1483a' });
    if(heavy && exposed) msg(localText(bilingual('대구경에 무방비로 맞았다 — 세 배','Caught exposed by a large-caliber shot — triple damage')));
    else if(exposed)     msg(localText(bilingual('재장전 중에 맞았다 — 한 배 반','Hit while reloading — 1.5x damage')));
    else if(heavy)       msg(localText(bilingual('대구경 — 두 배','Large caliber — double damage')));
    if(S.hp <= 0){ S.hp = 0; playerDown(); } else resetFoeAim();
  }

  function foeDown(){
    const f0 = F();
    telemetryEvent('duel_end', duelTelemetryPayload('win'), S.stage);
    ensureCombatStats();
    S.doctrineStats[S.doctrine].wins++;
    S.posStats[targetZone()].wins++;
    const g = Math.floor(clearGold(S.stage) * (f0.boss ? 3 : 1) * chainMul());
    const secured = Math.floor(g * 0.5), carried = g - secured;
    S.expedition.securedGold += secured;
    S.expedition.carriedGold += carried;
    S.expedition.kills++;
    S.kills++;
    if(revealIntel(S.stage + 1)) S.pendingRumor = rumorFor(S.stage + 1);
    S.phase = 'down'; S.pt = 1.4; S.fall = 0;
    msg(currentLanguage === 'ko'
      ? `쓰러졌다 — 현상금 +${fmt(g)} · 확보 ${fmt(secured)} / 미정산 ${fmt(carried)}${S.chain>1?`  (연쇄 ${S.chain} · x${chainMul().toFixed(2)})`:''}`
      : `Enemy down — bounty +${fmt(g)} · secured ${fmt(secured)} / carried ${fmt(carried)}${S.chain>1?`  (chain ${S.chain} · x${chainMul().toFixed(2)})`:''}`);
    shopDirty = true;
  }

  function enterBetween(win){
    S.phase = 'between';
    S.betweenWin = win;
    S.bLock = 0.6;          // 교전 중의 연타가 그대로 넘겨버리지 않게
  }

  function playerDown(){
    const duelSummary = duelTelemetryPayload('loss');
    telemetryEvent('duel_end', duelSummary, S.stage);
    telemetryEvent('player_death', {
      doctrine:S.doctrine,
      duration_ms:duelSummary.duration_ms,
      enemy_hp:duelSummary.enemy_hp,
      trait_ids:duelSummary.trait_ids
    }, S.stage);
    ensureCombatStats();
    S.doctrineStats[S.doctrine].deaths++;
    S.posStats[targetZone()].losses++;
    S.deaths++;
    S.deathStage = S.stage;
    S.phase = 'beaten'; S.pt = 2.2;
    const focusLeft = S.doctrine === 'precision'
      ? currentLanguage === 'ko'
        ? `\n집중 ${focusUsesLeft()}회 · ${S.focus.toFixed(2)}초 남음`
        : `\nFocus ${focusUsesLeft()} uses · ${S.focus.toFixed(2)}s left`
      : '';
    msg(currentLanguage === 'ko'
      ? `제 ${S.stage} 결투에서 끝났다\n연쇄 ${S.chain} 소멸${focusLeft}`
      : `Your run ended at Duel ${S.stage}\nChain ${S.chain} lost${focusLeft}`, 2.2);
    finishExpedition(false, true);
  }

  /* ───── loop ───── */
  function update(dt){
    focusing = (focusPtrHeld || focusKeyHeld) && canFocus();
    if(focusing && !focusWasActive) S.focusActivations++;
    focusWasActive = focusing;
    if(focusing){
      if(duelTelemetry) duelTelemetry.focusMs += dt * 1000;
      S.focus = Math.max(0, S.focus - dt);
      if(S.focus <= 0) focusing = false;
    }
    if(S.firstStrike){
      // 판정상 머리 확정인 상태를 커서에도 그대로 보여준다.
      S.cursor = headCenter();
    } else {
      const cursorMul = focusing ? focusSpeed() : 1;
      S.cursor += S.dir * dt * cursorMul / sweepT();
      if(S.cursor > 1){ S.cursor = 1; S.dir = -1; }
      if(S.cursor < 0){ S.cursor = 0; S.dir = 1; }
    }

    if(S.phase === 'standoff'){
      S.pt -= dt;
      if(S.pt <= 0){
        lockDoctrine();
        if(isRewind()) rewindStart();
        else { S.phase = 'draw'; S.drawAt = performance.now(); sfxDraw(); }
      }
    } else if(S.phase === 'draw'){
      const el = (performance.now() - S.drawAt) / 1000;
      if(el > foeDrawT() + 0.55) resolveDraw(true);
    } else if(S.phase === 'fight'){
      if(S.bleed > 0 && S.bleedT > 0){
        const tick = Math.min(S.bleed, S.bleed * dt / Math.max(dt, S.bleedT));
        S.bleed -= tick; S.bleedT = Math.max(0, S.bleedT - dt);
        S.foeHp -= tick;
        addPartDamage(BODY.find(p=>p.id==='belly'), tick);
        if(S.foeHp <= 0){ S.bleed = 0; S.bleedT = 0; foeDown(); }
      }
      if(S.phase !== 'fight') return;
      if(S.reload > 0){
        S.reload -= dt;
        const prog = Math.min(1, 1 - S.reload / reloadT());
        S.ammo = Math.min(capacity(), S.ammoStart + Math.floor(prog * S.reloadLoad));
        if(S.reload <= 0){
          S.reload = 0;
          S.ammo = Math.min(capacity(), S.ammoStart + S.reloadLoad);
          S.reloadLoad = 0;
          sfxReload();
        }
      } else if(S.cool > 0){
        S.cool -= dt; if(S.cool < 0) S.cool = 0;
      }
      // 교전 중 시작된 누름이 이어지고 있으면 패닝으로 넘어간다
      if((ptrHeld || keyHeld) && holdArmed && S.reload <= 0){
        holdT += dt;
        if(holdT > 0.26){
          fanning = true;
          focusPtrHeld = false; focusKeyHeld = false; focusing = false;
        }
      } else {
        holdT = 0; fanning = false;
      }
      if(fanning && S.cool <= 0) fanShot();
      S.foeAim += dt / S.aimDur;
      if(S.foeAim >= 1) foeFire();
    } else if(S.phase === 'between'){
      if(S.bLock > 0) S.bLock -= dt;      // 결투 사이에는 시간이 흐르지 않는다
    } else {
      S.pt -= dt;
      if(S.phase === 'down') S.fall = Math.min(1, S.fall + dt*2.2);
      if(S.pt <= 0){
        if(S.phase === 'down'){
          // 두목을 넘으면 그 자리가 거점이 된다
          if(S.stage % 5 === 0){
            S.checkpoint = Math.max(S.checkpoint, S.stage);
            S.pendingMastery = currentLanguage === 'ko'
              ? `두목 돌파 · 머리 x${headMult().toFixed(0)} · 몸 숙련 x${bodyMastery().toFixed(2)}`
              : `Boss defeated · Head x${headMult().toFixed(0)} · Body mastery x${bodyMastery().toFixed(2)}`;
          }
          S.stage++;
          S.bestStage = Math.max(S.bestStage, S.stage);
          // 원정 중에는 모든 승리 뒤에 계속 추적할지 귀환할지 결정한다.
          enterBetween(true);
          save();
        } else {
          S.stage = S.checkpoint + 1;   // 마지막으로 넘긴 두목 다음부터
          finishExpedition(false);
        }
      }
    }

    S.cylSpin += (S.cylTarget - S.cylSpin) * Math.min(1, dt*16);

    for(let i=tracers.length-1;i>=0;i--){
      tracers[i].t += dt;
      if(tracers[i].t > tracers[i].max) tracers.splice(i,1);
    }
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i]; p.t += dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.94; p.vy += 60*dt;
      if(p.t > p.max) parts.splice(i,1);
    }
    for(let i=texts.length-1;i>=0;i--){
      texts[i].t += dt;
      if(texts[i].t > 0.85) texts.splice(i,1);
    }
    for(let i=shotMarks.length-1;i>=0;i--){
      shotMarks[i].t += dt;
      if(shotMarks[i].t > shotMarks[i].max) shotMarks.splice(i,1);
    }

    const wd = weeds[0];
    if(wd.x < -0.1){
      if(Math.random() < dt*0.10){
        wd.x = 1.12; wd.r = 6 + Math.random()*7;
        wd.sp = 0.10 + Math.random()*0.09;
        wd.y = 0.60 + Math.random()*0.30;
      }
    } else {
      wd.x -= wd.sp * dt; wd.rot -= wd.sp * dt * 14;
    }

    S.shake *= Math.pow(0.0012, dt);
    S.flash = Math.max(0, S.flash - dt*3);
    S.red = Math.max(0, S.red - dt*1.8);
    S.recoil = Math.max(0, S.recoil - dt*6);
    S.foeRecoil = Math.max(0, S.foeRecoil - dt*5);
    S.zoneFlash = Math.max(0, S.zoneFlash - dt*2.6);
    savedFlash = Math.max(0, savedFlash - dt*1.4);
    if(wipeArm > 0){
      wipeArm -= dt;
      if(wipeArm <= 0){
        $('wipeBtn').classList.remove('armed');
        $('wipeBtn').textContent = ui('wipe');
      }
    }
    if(msgT > 0) msgT -= dt;
  }

  /* ───── field render ───── */
  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    const sx = (Math.random()-0.5)*S.shake, sy = (Math.random()-0.5)*S.shake;
    ctx.save(); ctx.translate(sx, sy);

    drawBackdrop(); drawWeed();
    drawFoe(); drawPlayer();

    tracers.forEach(t => {
      const e = t.t / t.max;
      ctx.globalAlpha = 1 - e*e;
      ctx.strokeStyle = t.c; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(t.x0, t.y0); ctx.lineTo(t.x1, t.y1); ctx.stroke();
      ctx.globalAlpha = 1;
    });
    parts.forEach(p => {
      ctx.globalAlpha = 1 - p.t/p.max;
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x-p.r/2, p.y-p.r/2, p.r, p.r);
    });
    ctx.globalAlpha = 1;
    texts.forEach(t => {
      ctx.globalAlpha = 1 - t.t/0.85;
      ctx.fillStyle = t.c;
      ctx.font = '700 15px "IBM Plex Mono",monospace';
      ctx.textAlign = 'center';
      ctx.fillText(t.s, t.x, t.y - t.t*34);
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    drawFoeHp();
    drawLife();
    if(S.phase === 'standoff' || S.phase === 'draw') drawVignette();
    if(S.red > 0){
      ctx.fillStyle = `rgba(150,40,30,${S.red*0.34})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  function drawBackdrop(){
    if(!duelBackdropReady){
      drawSky(); drawMesas(); drawGround();
      return;
    }

    // cover 방식으로 채워 모바일에서도 캔버스가 비지 않게 하되,
    // 원본의 결투용 중앙 구도는 계속 화면 중심에 둔다.
    const srcRatio = duelBackdrop.naturalWidth / duelBackdrop.naturalHeight;
    const dstRatio = W / H;
    let sx = 0, sy = 0, sw = duelBackdrop.naturalWidth, sh = duelBackdrop.naturalHeight;
    if(dstRatio > srcRatio){
      sh = sw / dstRatio;
      sy = (duelBackdrop.naturalHeight - sh) * 0.5;
    } else {
      sw = sh * dstRatio;
      sx = (duelBackdrop.naturalWidth - sw) * 0.5;
    }
    ctx.drawImage(duelBackdrop, sx, sy, sw, sh, -20, -20, W+40, H+40);

    // 기존 검갈색 UI와 실루엣이 한 화면으로 묶이도록 색과 가장자리를 누른다.
    const dusk = ctx.createLinearGradient(0,0,0,H);
    dusk.addColorStop(0,'rgba(28,18,14,.22)');
    dusk.addColorStop(0.56,'rgba(38,22,12,.12)');
    dusk.addColorStop(1,'rgba(20,13,9,.30)');
    ctx.fillStyle = dusk; ctx.fillRect(-20,-20,W+40,H+40);

    const edge = ctx.createRadialGradient(W*.52,H*.47,H*.18,W*.52,H*.47,Math.max(W,H)*.72);
    edge.addColorStop(0,'rgba(0,0,0,0)');
    edge.addColorStop(1,'rgba(8,6,4,.34)');
    ctx.fillStyle = edge; ctx.fillRect(-20,-20,W+40,H+40);
  }

  function drawSky(){
    const hz = horizon();
    const g = ctx.createLinearGradient(0,0,0,hz);
    g.addColorStop(0,'#2b1d16');
    g.addColorStop(0.55,'#7d4526');
    g.addColorStop(1,'#d8913c');
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,hz+20);
    ctx.fillStyle = 'rgba(255,224,150,.55)';
    ctx.beginPath(); ctx.arc(W*0.60, hz - H*0.06, H*0.085, 0, Math.PI*2); ctx.fill();
  }

  function drawMesas(){
    const hz = horizon();
    ctx.fillStyle = '#3b2419';
    [[0.02,0.30,0.11],[0.30,0.20,0.075],[0.82,0.34,0.10]].forEach(([a,w,h])=>{
      const x = W*a, ww = W*w, hh = H*h;
      ctx.beginPath();
      ctx.moveTo(x, hz);
      ctx.lineTo(x + ww*0.18, hz - hh);
      ctx.lineTo(x + ww*0.82, hz - hh*0.92);
      ctx.lineTo(x + ww, hz);
      ctx.closePath(); ctx.fill();
    });
  }

  function drawGround(){
    const hz = horizon();
    const g = ctx.createLinearGradient(0,hz,0,H);
    g.addColorStop(0,'#8a6440');
    g.addColorStop(1,'#3a2818');
    ctx.fillStyle = g; ctx.fillRect(-20,hz,W+40,H-hz+20);
    ctx.strokeStyle = 'rgba(40,26,16,.30)'; ctx.lineWidth = 1;
    for(let i=0;i<16;i++){
      const y = hz + Math.pow(i/16,1.7)*(H-hz);
      const len = 20 + i*14, x = (i*137) % W;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke();
    }
  }

  function drawWeed(){
    const wd = weeds[0];
    if(wd.x < -0.1 || wd.x > 1.2) return;
    const hz = horizon();
    const x = wd.x * W, y = hz + wd.y*(H-hz);
    ctx.save(); ctx.translate(x,y); ctx.rotate(wd.rot);
    ctx.strokeStyle = '#5a412a'; ctx.lineWidth = 1.6;
    for(let i=0;i<7;i++){
      const a = i*Math.PI/3.5;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*wd.r, Math.sin(a)*wd.r); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,wd.r*0.62,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawGunman(x, foot, h, col, facing, armT, gunGlow){
    ctx.save(); ctx.translate(x, foot); ctx.scale(facing, 1);
    ctx.fillStyle = col;
    ctx.fillRect(-h*0.10, -h*0.42, h*0.062, h*0.42);
    ctx.fillRect( h*0.038, -h*0.42, h*0.062, h*0.42);
    ctx.fillRect(-h*0.115, -h*0.045, h*0.10, h*0.045);
    ctx.fillRect( h*0.030, -h*0.045, h*0.10, h*0.045);
    ctx.beginPath();
    ctx.moveTo(-h*0.135, -h*0.78);
    ctx.lineTo( h*0.135, -h*0.78);
    ctx.lineTo( h*0.160, -h*0.30);
    ctx.lineTo(-h*0.160, -h*0.30);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -h*0.875, h*0.078, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, -h*0.935, h*0.175, h*0.028, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-h*0.062, -h*1.020, h*0.124, h*0.090);

    const ang = -Math.PI*0.42 + armT * Math.PI*0.42;
    const sx0 = h*0.095, sy0 = -h*0.745, L = h*0.26;
    const hx = sx0 + Math.cos(ang)*L, hy = sy0 + Math.sin(ang)*L;
    ctx.strokeStyle = col; ctx.lineWidth = h*0.048; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang);
    ctx.fillRect(0, -h*0.016, h*0.11, h*0.032);
    ctx.fillRect(h*0.01, 0, h*0.026, h*0.048);
    ctx.restore();

    if(gunGlow > 0.35){
      const gx = hx + Math.cos(ang)*h*0.12, gy = hy + Math.sin(ang)*h*0.12;
      ctx.globalAlpha = gunGlow; ctx.fillStyle = '#ffe9a8';
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a = ang + i*Math.PI/4, r = i%2 ? h*0.03 : h*0.085;
        const px = gx + Math.cos(a)*r, py = gy + Math.sin(a)*r;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawPlayer(){
    const p = playerPos();
    const holstered = (S.phase === 'standoff' && !isRewind());
    drawGunman(p.x, p.foot, p.h, '#14100c', 1, holstered ? 0 : 1, S.recoil);
  }

  function drawFoe(){
    const f = foePos(), col = F().boss ? '#3a2410' : '#2c1f16';
    const lost   = S.phase === 'beaten' || (S.phase === 'between' && !S.betweenWin);
    const fallen = S.phase === 'down'    || (S.phase === 'between' &&  S.betweenWin);
    if(lost){
      drawGunman(f.x, f.foot, f.h, col, -1, 0.15, 0);
      return;
    }
    if(fallen){
      ctx.save();
      ctx.translate(f.x, f.foot);
      ctx.rotate(-S.fall * Math.PI*0.48);
      ctx.globalAlpha = 1 - S.fall*0.25;
      drawGunman(0, 0, f.h, col, -1, 0.2, 0);
      ctx.globalAlpha = 1;
      ctx.restore();
      return;
    }
    const holstered = (S.phase === 'standoff' || S.phase === 'draw');
    const armT = holstered ? 0 : Math.min(1, S.foeAim / 0.62);
    drawGunman(f.x, f.foot, f.h, col, -1, armT, S.foeRecoil);

    if(S.flash > 0){
      ctx.globalAlpha = S.flash*0.45;
      ctx.fillStyle = '#e8d9b4';
      ctx.beginPath();
      ctx.ellipse(f.x, f.foot - f.h*0.55, f.h*0.30, f.h*0.55, 0, 0, Math.PI*2);
      ctx.fill(); ctx.globalAlpha = 1;
    }
    if(!holstered && S.foeAim > 0.80){
      const m = foeMuzzle();
      ctx.globalAlpha = (S.foeAim-0.80)/0.20;
      ctx.fillStyle = '#ff5a3c';
      ctx.beginPath(); ctx.arc(m.x, m.y, 3.2 + F().heavy*1.8, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawFoeHp(){
    const f = foePos();
    const w = Math.min(200, W*0.34), x = f.x - w/2, y = f.foot - f.h*1.32;
    const ratio = Math.max(0, S.foeHp / S.foeMaxHp);
    ctx.fillStyle = 'rgba(10,8,6,.7)'; ctx.fillRect(x, y, w, 8);
    ctx.fillStyle = ratio > 0.5 ? '#c9a173' : ratio > 0.2 ? '#e0a93c' : '#c1483a';
    ctx.fillRect(x, y, w*ratio, 8);
    ctx.strokeStyle = 'rgba(230,220,196,.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(x+.5, y+.5, w-1, 7);
    ctx.fillStyle = '#e6dcc4'; ctx.font = '700 10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${fmt(Math.max(0,S.foeHp))} / ${fmt(S.foeMaxHp)}`, f.x, y - 4);
    if(F().armor > 0){
      ctx.textAlign = 'left';
      drawArmor(x + w + 6, y + 4, F().armor, S.foeArmor, 1);
    }
    if(S.phase === 'fight'){
      const ay = y + 11;
      ctx.fillStyle = 'rgba(10,8,6,.6)'; ctx.fillRect(x, ay, w, 3);
      ctx.fillStyle = S.foeAim > 0.8 ? '#ff5a3c' : 'rgba(230,220,196,.5)';
      ctx.fillRect(x, ay, w*Math.min(1,S.foeAim), 3);
    }
  }

  // 적과 완전히 같은 형태의 체력바 — 규칙이 같다는 걸 화면으로 보여준다
  function drawLife(){
    const w = Math.min(200, W*0.34), x = 12, y = 22;
    const r = Math.max(0, S.hp / Math.max(1, maxHp()));
    ctx.fillStyle = 'rgba(10,8,6,.7)'; ctx.fillRect(x, y, w, 8);
    ctx.fillStyle = r > 0.5 ? '#c9a173' : r > 0.2 ? '#e0a93c' : '#c1483a';
    ctx.fillRect(x, y, w*r, 8);
    ctx.strokeStyle = 'rgba(230,220,196,.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(x+.5, y+.5, w-1, 7);
    ctx.font = '700 10px "IBM Plex Mono",monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e6dcc4';
    ctx.fillText(`${fmt(Math.max(0,S.hp))} / ${fmt(maxHp())}`, x, y - 4);
    drawArmor(x, y + 13, armorMax(), S.armor, 1);
  }

  // 코트 잔량 — 남은 건 채워진 방패, 쓴 건 빈 테두리
  function drawArmor(x, y, total, left, dir){
    for(let i=0;i<total;i++){
      const px = x + dir*i*11;
      ctx.beginPath();
      ctx.moveTo(px, y-4); ctx.lineTo(px+7, y-4);
      ctx.lineTo(px+7, y+1); ctx.lineTo(px+3.5, y+5); ctx.lineTo(px, y+1);
      ctx.closePath();
      if(i < left){ ctx.fillStyle = '#9fb0bd'; ctx.fill(); }
      else { ctx.strokeStyle = 'rgba(159,176,189,.35)'; ctx.lineWidth = 1; ctx.stroke(); }
    }
  }

  function drawVignette(){
    const g = ctx.createRadialGradient(W*0.5,H*0.45,H*0.18,W*0.5,H*0.45,H*0.95);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }

  /* ───── cylinder render ───── */
  function drawCylinder(){
    const cap = capacity(), R = CW*0.5, cxp = R, cyp = R;
    cx2.setTransform(DPR,0,0,DPR,0,0);
    cx2.clearRect(0,0,CW,CW);
    cx2.beginPath(); cx2.arc(cxp, cyp, R*0.90, 0, Math.PI*2);
    cx2.fillStyle = '#241c15'; cx2.fill();
    cx2.strokeStyle = S.reload > 0 ? '#e0a93c' : '#453424';
    cx2.lineWidth = 2; cx2.stroke();

    const step = Math.PI*2/cap, cr = R*0.145;
    for(let k=0;k<cap;k++){
      const a = -Math.PI/2 + (k - S.cylSpin)*step;
      const px = cxp + Math.cos(a)*R*0.56, py = cyp + Math.sin(a)*R*0.56;
      cx2.beginPath(); cx2.arc(px, py, cr, 0, Math.PI*2);
      if(k >= (cap - S.ammo)){
        cx2.fillStyle = '#e0a93c'; cx2.fill();
        cx2.beginPath(); cx2.arc(px, py, cr*0.42, 0, Math.PI*2);
        cx2.fillStyle = '#8a6a20'; cx2.fill();
      } else {
        cx2.fillStyle = '#100d09'; cx2.fill();
        cx2.strokeStyle = '#3a2c1e'; cx2.lineWidth = 1; cx2.stroke();
      }
    }
    cx2.beginPath(); cx2.arc(cxp, cyp, R*0.16, 0, Math.PI*2);
    cx2.fillStyle = '#5c4526'; cx2.fill();
    cx2.fillStyle = '#e6dcc4';
    cx2.fillRect(cxp-1, cyp - R*0.90, 2, R*0.13);
  }

      al.innerHTML = weakHere
        ? `<b style="color:var(--blood)">${localText(bilingual('치명점','VITAL'))} · ${localText(F().weak.name)}</b> · x${eff.toFixed(2)} · ${S.ammo}/${capacity()} +${S.expedition.reserveAmmo}`

        : cp
        ? `<b style="color:${cp.col}">${localText(cp.name)}</b> · x${eff.toFixed(2)}`+
          `${F().bodyRes<1 && cp.id!=='head' ? localText(bilingual(' (조끼)',' (vest)')) : ''} · ${S.ammo}/${capacity()} +${S.expedition.reserveAmmo}`
        : `<span style="color:#7f8c96">${localText(bilingual('허공 · 피해 없음','Air · no damage'))}</span> · ${S.ammo}/${capacity()} +${S.expedition.reserveAmmo}`;
