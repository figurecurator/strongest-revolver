      ? localText(bilingual(`집중 급소 <b>${doctrineStat.focusCrits}</b>`,`Focused vitals <b>${doctrineStat.focusCrits}</b>`))
      : S.doctrine === 'duelist'
      ? localText(bilingual(`DRAW 확정타 <b>${doctrineStat.drawShots}</b> · 연속 급소 추가 피해 <b>${fmt(doctrineStat.comboBonus)}</b>`,`Guaranteed DRAW shots <b>${doctrineStat.drawShots}</b> · Vital-streak bonus damage <b>${fmt(doctrineStat.comboBonus)}</b>`))
      : currentLanguage === 'ko'
        ? `조준 지연 <b>${(doctrineStat.suppressMs/1000).toFixed(1)}초</b> · 다리 지연 <b>${doctrineStat.legDelays}</b> · 패닝 코트 <b>${doctrineStat.fanArmor}</b>`
        : `Aim delay <b>${(doctrineStat.suppressMs/1000).toFixed(1)}s</b> · Leg delays <b>${doctrineStat.legDelays}</b> · Fanning armor <b>${doctrineStat.fanArmor}</b>`;
    const partMultipliers = BODY.map(p =>
      `${localText(p.name)} <b>x${(p.id==='head'?headMult():bodyMult(p)*F().bodyRes).toFixed(2)}</b>`
    ).join(' · ');
    $('stats').innerHTML = currentLanguage === 'ko'
      ? `교리 <b>${localText(doctrine().name)}</b> · 승리 <b>${doctrineStat.wins}</b> · 사망 <b>${doctrineStat.deaths}</b> · ${doctrineSummary}<br>`+
        `한 발 <b>${fmt(dmgPerShot())}</b> · ${partMultipliers} · 허공 <b>0</b><br>`+
        `머리 창 <b>${(headW()*sweepT()*1000).toFixed(0)}ms</b> (몸 ${(bodyW()*100).toFixed(0)}% · 커서 ${sweepT().toFixed(2)}s) · 몸 숙련 <b>x${bodyMastery().toFixed(2)}</b> · 머리 <b>x${headMult().toFixed(0)}</b> · 치명점 <b>x${weakMult().toFixed(0)}</b><br>`+
        `장탄 <b>${S.ammo}/${capacity()}</b> · 예비 <b>${S.expedition.reserveAmmo}/${reserveCapacity()}</b> · 연사 <b>${shotGap().toFixed(2)}s</b> · 패닝 <b>${fanGap().toFixed(2)}s</b> · 집중 <b>${S.doctrine==='precision'?focusUsesLeft()+'회 · '+focusPct()+'%':'교리로 사용 불가'}</b> · 재장전 <b>${reloadT().toFixed(2)}s</b><br>`+
        `상대 조준 <b>${foeAimT().toFixed(2)}s</b>${F().jitter?' ±50%':''} · 뽑기 창 <b>${(foeDrawT()*1000).toFixed(0)}ms</b>${drawBonusText?` (${drawBonusText})`:''} · 내 체력 <b>${fmt(Math.max(0,S.hp))}/${fmt(maxHp())}</b>`+
          `${armorMax()?` · 코트 <b>${S.armor}/${armorMax()}</b>`:''} · 상대 한 발 <b>${fmt(foeDmg())}</b>`+
          `${F().armor?` · 상대 코트 <b>${S.foeArmor}/${F().armor}</b>`:''}<br>`+
        `원정 <b>${S.expedition.active?S.expedition.kills+'명':'마을'}</b> · 확보 <b>${fmt(S.expedition.securedGold)}</b> · 미정산 <b>${fmt(S.expedition.carriedGold)}</b><br>`+
        `최고 <b>제 ${S.bestStage} 결투</b> · 거점 <b>제 ${S.checkpoint||0} 두목</b> · 연쇄 <b>${S.chain}</b> (최고 ${S.bestChain}) · 처치 <b>${S.kills}</b><br>`+
        `급소 명중률 <b>${acc}%</b> (조준 ${S.shots}발 · 패닝 ${S.fanShots}발 · 치명점 ${S.weakHits}발) · 최고 연속 <b>${S.bestCombo}</b>`+
        (S.bestDraw ? ` · 최속 뽑기 <b>${(S.bestDraw*1000).toFixed(0)}ms</b>` : '')+`<br>`+
        `방향별 급소 <b>→ ${dirAcc('right')} · ← ${dirAcc('left')}</b> · 집중 발동 <b>${S.focusActivations}회</b><br>`+
        `몸 사격 · ${partSummary}`
      : `Doctrine <b>${localText(doctrine().name)}</b> · Wins <b>${doctrineStat.wins}</b> · Deaths <b>${doctrineStat.deaths}</b> · ${doctrineSummary}<br>`+
        `Damage <b>${fmt(dmgPerShot())}</b> · ${partMultipliers} · Air <b>0</b><br>`+
        `Head window <b>${(headW()*sweepT()*1000).toFixed(0)}ms</b> (body ${(bodyW()*100).toFixed(0)}% · sweep ${sweepT().toFixed(2)}s) · Body mastery <b>x${bodyMastery().toFixed(2)}</b> · Head <b>x${headMult().toFixed(0)}</b> · Vital <b>x${weakMult().toFixed(0)}</b><br>`+
        `Ammo <b>${S.ammo}/${capacity()}</b> · reserve <b>${S.expedition.reserveAmmo}/${reserveCapacity()}</b> · Fire <b>${shotGap().toFixed(2)}s</b> · Fan <b>${fanGap().toFixed(2)}s</b> · Focus <b>${S.doctrine==='precision'?focusUsesLeft()+' uses · '+focusPct()+'%':'unavailable'}</b> · Reload <b>${reloadT().toFixed(2)}s</b><br>`+
        `Enemy aim <b>${foeAimT().toFixed(2)}s</b>${F().jitter?' ±50%':''} · Draw window <b>${(foeDrawT()*1000).toFixed(0)}ms</b>${drawBonusText?` (${drawBonusText})`:''} · Health <b>${fmt(Math.max(0,S.hp))}/${fmt(maxHp())}</b>`+
          `${armorMax()?` · Coat <b>${S.armor}/${armorMax()}</b>`:''} · Enemy shot <b>${fmt(foeDmg())}</b>`+
          `${F().armor?` · Enemy coat <b>${S.foeArmor}/${F().armor}</b>`:''}<br>`+
        `Hunt <b>${S.expedition.active?S.expedition.kills+' targets':'town'}</b> · secured <b>${fmt(S.expedition.securedGold)}</b> · carried <b>${fmt(S.expedition.carriedGold)}</b><br>`+
        `Best <b>Duel ${S.bestStage}</b> · Checkpoint <b>Boss ${S.checkpoint||0}</b> · Chain <b>${S.chain}</b> (best ${S.bestChain}) · Kills <b>${S.kills}</b><br>`+
        `Vital accuracy <b>${acc}%</b> (aimed ${S.shots} · fanned ${S.fanShots} · discovered ${S.weakHits}) · Best streak <b>${S.bestCombo}</b>`+
        (S.bestDraw ? ` · Fastest draw <b>${(S.bestDraw*1000).toFixed(0)}ms</b>` : '')+`<br>`+
        `Directional vitals <b>→ ${dirAcc('right')} · ← ${dirAcc('left')}</b> · Focus activations <b>${S.focusActivations}</b><br>`+
        `Body shots · ${partSummary}`;
  }

  /* ───── input ───── */
  function trigger(e){
    if(e) e.preventDefault();
    wake();
    focusing = (focusPtrHeld || focusKeyHeld) && canFocus();
    if(S.phase === 'between'){
      if(S.bLock <= 0){
        lockDoctrine();
        if(S.expedition.active){
          if(S.ammo + S.expedition.reserveAmmo <= 0){
            msg(localText(bilingual('탄약이 없다 — 마을로 귀환해야 한다','No ammunition — return to town')), 1.6);
            return;
          }
        } else startExpedition();
        newDuel();
      }
      return;
    }
    if(S.phase === 'standoff'){
      lockDoctrine();
      isRewind() ? rewindStart() : earlyDraw();
      return;
    }
    if(S.phase === 'draw'){ resolveDraw(false); return; }
    shoot();
    if(!focusing) holdArmed = true;   // 집중 사격은 홀드 패닝으로 이어지지 않는다
  }
  const release = () => {
    if(!ptrHeld && !keyHeld){ holdArmed = false; holdT = 0; fanning = false; }
  };
  $('gauge').addEventListener('pointerdown', e => { ptrHeld = true; trigger(e); });
  $('fireBtn').addEventListener('pointerdown', e => { ptrHeld = true; trigger(e); });
  cv.addEventListener('pointerdown', e => { ptrHeld = true; trigger(e); });
  $('focusBtn').addEventListener('pointerdown', e => {
    e.preventDefault(); wake();
    if(canFocus()){ focusPtrHeld = true; focusing = true; }
  });
  window.addEventListener('pointerup',     () => { ptrHeld = false; focusPtrHeld = false; release(); });
  window.addEventListener('pointercancel', () => { ptrHeld = false; focusPtrHeld = false; release(); });
  $('reloadBtn').addEventListener('pointerdown', e => {
    e.preventDefault();
    if(S.phase === 'between' && S.expedition.active) returnToTown();
    else startReload();
  });
  window.addEventListener('keydown', e => {
    if(dossierOpen){
      if(e.code === 'Escape') setDossier(false);
      if(e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') e.preventDefault();
      return;
    }
    // Space를 누르고 있을 때 발생하는 반복 keydown도 먼저 막아야
    // 브라우저의 기본 페이지 스크롤이 패닝 도중 되살아나지 않는다.
    if(e.code === 'Space' || e.code === 'Enter') e.preventDefault();
    if(e.repeat) return;
    if(e.code === 'Space' || e.code === 'Enter'){ keyHeld = true; trigger(e); }
    else if(e.code === 'KeyR'){
      e.preventDefault();
      if(S.phase === 'between' && S.expedition.active) returnToTown();
      else startReload();
    }
    else if(e.code === 'ShiftLeft' || e.code === 'ShiftRight'){
      e.preventDefault(); wake();
      if(canFocus()){ focusKeyHeld = true; focusing = true; }
    }
  });
  window.addEventListener('keyup', e => {
    // 포커스된 버튼은 Space keyup에도 기본 클릭/스크롤을 만들 수 있다.
    if(e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault(); keyHeld = false; release();
    }
    else if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') focusKeyHeld = false;
  });
  window.addEventListener('blur', () => {
    ptrHeld = false; keyHeld = false; focusPtrHeld = false; focusKeyHeld = false;
    holdArmed = false; holdT = 0; fanning = false; focusing = false;
  });
  $('sndBtn').onclick = () => {
    wake();
    SFX.on = !SFX.on;
    $('sndBtn').classList.toggle('on', SFX.on);
    $('sndBtn').textContent = SFX.on ? '\u266a' : '\u266a\u0338';
    if(SFX.on) sfxReload();
  };
  function setLanguage(next){
    if(next !== 'ko' && next !== 'en') return;
    currentLanguage = next;
    try{ localStorage.setItem(LANGUAGE_KEY, currentLanguage); }catch(e){}
    applyStaticLanguage();
    if(S.pendingRumor) S.pendingRumor = rumorFor(S.stage);
    if(S.pendingMastery){
      S.pendingMastery = currentLanguage === 'ko'
        ? `두목 돌파 · 머리 x${headMult().toFixed(0)} · 몸 숙련 x${bodyMastery().toFixed(2)}`
        : `Boss defeated · Head x${headMult().toFixed(0)} · Body mastery x${bodyMastery().toFixed(2)}`;
    }
    msgT = 0;
    doctrineRenderKey = ''; silKey = '';
    shopDirty = true; chipsDirty = true; intelDirty = true;
    renderSlots();
  }
  $('langBtn').onclick = () => setLanguage(currentLanguage === 'ko' ? 'en' : 'ko');

  /* ───── save ─────
     localStorage를 주 저장소로 쓰고, Claude 아티팩트 안에서 열렸을 때만
     window.storage를 보조로 함께 쓴다. 둘 다 실패하면 조용히 비활성. */
  const LEGACY_SAVE_KEY = 'revolver:save2';
  const SLOT_PREFIX = 'revolver:save2:slot';
  const ACTIVE_SLOT_KEY = 'revolver:activeSlot';
  const SLOT_MIGRATION_KEY = 'revolver:slotsMigrated';
  const LVL_DEFAULT = { dmg:0, gauge:0, trigger:0, reload:0, cyl:0, vest:0, hp:0, hunch:0,
                        focusUses:0, focusSlow:0 };
  const CAN_LS = (() => {
    try{
      localStorage.setItem('__revolver_probe','1');
      localStorage.removeItem('__revolver_probe');
      return true;
    }catch(e){ return false; }
  })();
  let activeSlot = 1;
  try{
    activeSlot = Math.max(1, Math.min(3, parseInt(localStorage.getItem(ACTIVE_SLOT_KEY), 10) || 1));
  }catch(e){}
  const saveKey = (slot=activeSlot) => SLOT_PREFIX + slot;
  let saveT = 0, savedFlash = 0, lastSaveAt = 0, noSave = false;

  // 기존 단일 세이브는 1번 슬롯에 한 번만 복사한다. 원본은 안전망으로 남긴다.
  function migrateLegacySave(){
    if(!CAN_LS) return;
    try{
      if(localStorage.getItem(SLOT_MIGRATION_KEY)) return;
      const legacy = localStorage.getItem(LEGACY_SAVE_KEY);
      if(legacy && !localStorage.getItem(saveKey(1))) localStorage.setItem(saveKey(1), legacy);
      localStorage.setItem(SLOT_MIGRATION_KEY, '1');
    }catch(e){}
  }
  migrateLegacySave();

  function snapshot(){
    // 쓰러지는 연출 중 저장해도 같은 현상금을 다시 받을 수 없도록 승리를 선반영한다.
    const pendingVictory = S.phase === 'down';
    const savedStage = S.stage + (pendingVictory ? 1 : 0);
    const savedCheckpoint = pendingVictory && S.stage % 5 === 0
      ? Math.max(S.checkpoint, S.stage) : S.checkpoint;
    // 재장전 탄은 시작할 때 이미 예비 탄약에서 빠진다. 저장에는 장전 완료 상태로 남긴다.
    const savedAmmo = S.reload > 0
      ? Math.min(capacity(), S.ammoStart + S.reloadLoad) : S.ammo;
    return {
      v: 19,
      gold:S.gold, stage:savedStage, bestStage:Math.max(S.bestStage, savedStage),
      chain:S.chain, bestChain:S.bestChain,
      hp:S.hp, armor:S.armor, ammo:savedAmmo,
      expedition:S.expedition, expeditionResult:S.expeditionResult,
      lvl:S.lvl, deaths:S.deaths, playMs:S.playMs, checkpoint:savedCheckpoint,
      shots:S.shots, crits:S.crits, kills:S.kills, fanShots:S.fanShots,
      bestCombo:S.bestCombo, bestDraw:S.bestDraw, weakHits:S.weakHits,
      focusActivations:S.focusActivations, dirStats:S.dirStats,
      partStats:S.partStats, posStats:S.posStats,
      doctrine:S.doctrine, doctrineChosen:S.doctrineChosen, doctrineStats:S.doctrineStats,
      intel:S.intel, discovered:S.discovered
    };
  }

  function save(){
    if(noSave) return false;
    const json = JSON.stringify(snapshot());
    let ok = false;
    try{ localStorage.setItem(saveKey(), json); ok = true; }catch(e){}
    try{ if(window.storage && window.storage.set) window.storage.set(saveKey(), json); }catch(e){}
    if(ok){ lastSaveAt = performance.now(); savedFlash = 1; renderSlots(); }
    return ok;
  }

  function slotMeta(slot){
    try{
      const raw = localStorage.getItem(saveKey(slot));
      if(!raw) return null;
      const d = JSON.parse(raw);
      return {
        bestStage:Math.max(1, d.bestStage|0, d.stage|0),
        playMs:Math.max(0, +d.playMs || 0)
      };
    }catch(e){ return null; }
  }

  function renderSlots(){
    $('slots').innerHTML = [1,2,3].map(slot => {
      const meta = slot === activeSlot
        ? { bestStage:S.bestStage, playMs:S.playMs }
        : slotMeta(slot);
      const detail = meta
        ? currentLanguage === 'ko'
          ? `제${meta.bestStage} · ${clock(meta.playMs)}`
          : `Duel ${meta.bestStage} · ${clock(meta.playMs)}`
        : localText(bilingual('빈 슬롯','Empty'));
      return `<button class="mini slot ${slot===activeSlot?'active':''}" data-slot="${slot}">`+
             `${currentLanguage==='ko'?`${slot}번`:`Slot ${slot}`} · ${detail}</button>`;
    }).join('');
    $('slots').querySelectorAll('.slot').forEach(b => b.onclick = () => {
      const slot = Math.max(1, Math.min(3, parseInt(b.dataset.slot, 10) || 1));
      if(slot === activeSlot) return;
      save();
      noSave = true;          // beforeunload가 새 슬롯에 현재 데이터를 덮지 않게 한다
      activeSlot = slot;
      try{ localStorage.setItem(ACTIVE_SLOT_KEY, String(slot)); }catch(e){}
      location.reload();
    });
  }

  function applySave(d){
    if(!d || typeof d !== 'object') return;
    const legacyFocus = d.lvl && isFinite(d.lvl.focus) ? Math.max(0, d.lvl.focus|0) : 0;
    Object.assign(S, d);
    // 예전 저장본에 없던 항목은 기본값으로 메운다
    S.lvl = Object.assign({}, LVL_DEFAULT, S.lvl);
    for(const k in LVL_DEFAULT)
      if(!isFinite(S.lvl[k])) S.lvl[k] = LVL_DEFAULT[k];
    // v14의 단일 집중 훈련은 v15의 집중 횟수로 그대로 전환한다.
    if(!(d.v >= 15) && legacyFocus > 0){
      S.lvl.focusUses = Math.max(S.lvl.focusUses, legacyFocus);
      S.migratedFocus = true;
    }
    delete S.lvl.focus;
    S.stage = Math.max(1, S.stage|0);
    S.bestStage = Math.max(S.stage, S.bestStage|0);
    S.deaths = Math.max(0, S.deaths|0);
    S.playMs = Math.max(0, +S.playMs || 0);
    // v10 대칭 개편: 규칙이 바뀌어 장비를 이어받을 수 없다.
    // 새 가격 기준으로 되살 수 있는 만큼 현상금으로 환산해 돌려준다.
    // v11: 가죽 코트가 체력에서 아머로 분리됐다. 기존 투자는 체력 쪽으로 옮긴다.
    if(d.v >= 10 && !(d.v >= 11)){
      S.lvl.hp = S.lvl.vest|0;
      S.lvl.vest = 0;
      S.migrated = true;
    }
    S.checkpoint = Math.max(0, S.checkpoint|0);
    if(!S.checkpoint && S.bestStage > 5) S.checkpoint = Math.floor((S.bestStage-1)/5)*5;
    S.intel = S.intel && typeof S.intel === 'object' && !Array.isArray(S.intel)
      ? Object.assign({}, S.intel) : {};
    S.discovered = S.discovered && typeof S.discovered === 'object' && !Array.isArray(S.discovered)
      ? Object.assign({}, S.discovered) : {};
    S.weakHits = Math.max(0, S.weakHits|0);
    if(!DOCTRINES.some(x => x.id === S.doctrine)) S.doctrine = 'precision';
    S.doctrineChosen = d.doctrineChosen === true;
    ensureCombatStats();
    // 기존 세이브는 이미 통과한 현재 구간의 정보만 소급 지급한다.
    if(!(d.v >= 16)){
      const from = Math.max(2, S.checkpoint + 1);
      const to = S.bestStage;
      for(let stage=from; stage<=to; stage++) S.intel[stage] = 1;
      S.migratedIntel = from <= to;
    }
    if(!(d.v >= 10)){
      const back = 30*(Math.pow(1.42, S.lvl.dmg) - 1)/0.42
                 + 26*(Math.pow(1.42, S.lvl.vest) - 1)/0.42;
      S.gold = Math.floor(S.gold + back);
      S.lvl = Object.assign({}, LVL_DEFAULT);
      S.stage = 1; S.checkpoint = 0;
      S.migrated = true;
    }
    S.chain = Math.max(0, S.chain|0);
    // 예감 상한이 3 → 2로 내려갔다. 초과분은 값을 돌려준다.
    if(S.lvl.hunch > 2){
      S.gold += 3000 * Math.pow(3.4, 2) * (S.lvl.hunch - 2);
      S.lvl.hunch = 2;
    }
    S.bestChain = Math.max(S.chain, S.bestChain|0);
    if(!isFinite(S.gold) || S.gold < 0) S.gold = 0;
    S.expedition = Object.assign(emptyExpedition(),
      d.expedition && typeof d.expedition === 'object' ? d.expedition : {});
    S.expedition.active = d.expedition && d.expedition.active === true;
    for(const key of ['kills','reserveAmmo','securedGold','carriedGold','startStage']){
      const fallback = key === 'startStage' ? S.stage : 0;
      S.expedition[key] = Math.max(key === 'startStage' ? 1 : 0,
        Math.floor(+S.expedition[key] || fallback));
    }
    S.expeditionResult = Object.assign(emptyExpeditionResult(),
      d.expeditionResult && typeof d.expeditionResult === 'object' ? d.expeditionResult : {});
    S.hp = Number.isFinite(+d.hp) ? Math.max(0, Math.min(maxHp(), +d.hp)) : maxHp();
    S.armor = Number.isFinite(+d.armor) ? Math.max(0, Math.min(armorMax(), d.armor|0)) : armorMax();
    S.ammo = Number.isFinite(+d.ammo) ? Math.max(0, Math.min(capacity(), d.ammo|0)) : capacity();
    S.reload = 0; S.reloadLoad = 0;
    if(S.expedition.active && S.hp <= 0) S.expedition.active = false;
  }

  async function load(){
    let done = false;
    try{
      const raw = localStorage.getItem(saveKey());
      if(raw){ applySave(JSON.parse(raw)); done = true; }
    }catch(e){}
    if(!done){
      try{
        if(window.storage && window.storage.get){
          let r = await window.storage.get(saveKey());
          // localStorage를 쓰지 못하는 환경도 기존 단일 세이브를 1번에서 읽는다.
          if((!r || !r.value) && activeSlot === 1) r = await window.storage.get(LEGACY_SAVE_KEY);
          if(r && r.value){ applySave(JSON.parse(r.value)); save(); }
        }
      }catch(e){}
    }
    if(S.expedition.active) newDuel(true);
    else enterTownReady(true);
    renderSlots();
    sendSessionStart();
    flushTelemetry();
    if(S.migratedFocus) msg(localText(bilingual('기존 집중 훈련을 집중 횟수로 전환했다','Previous Focus Training was converted into Focus Uses')), 6);
    else if(S.migrated) msg(localText(bilingual('규칙이 바뀌었다 — 장비를 현상금으로 돌려받았다','The rules changed — your outfit was refunded as bounty')), 6);
    else if(S.migratedIntel) msg(localText(bilingual('지나온 총잡이들의 소문이 현상금 목록에 기록됐다','Rumors about past gunslingers were added to the Bounty Board')), 6);
  }

  // 탭을 닫거나 백그라운드로 보낼 때 마지막 상태를 흘리지 않게
  window.addEventListener('beforeunload', () => { save(); beaconTelemetry(); });
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ save(); beaconTelemetry(); }
    else flushTelemetry();
  });
  window.addEventListener('error', event => {
    telemetryEvent('runtime_error', {
      kind:'error',
      message:String(event.message || 'unknown').slice(0, 240)
    }, S.stage);
  });
  window.addEventListener('unhandledrejection', event => {
    telemetryEvent('runtime_error', {
      kind:'unhandledrejection',
      message:String(event.reason && event.reason.message || event.reason || 'unknown').slice(0, 240)
    }, S.stage);
  });

  let wipeArm = 0;
  $('wipeBtn').onclick = () => {
    if(wipeArm > 0){
      noSave = true;
      try{ localStorage.removeItem(saveKey()); }catch(e){}
      try{ if(window.storage && window.storage.delete) window.storage.delete(saveKey()); }catch(e){}
      location.reload();
      return;
    }
    wipeArm = 4;
    $('wipeBtn').classList.add('armed');
    $('wipeBtn').textContent = currentLanguage === 'ko'
      ? `${activeSlot}번 삭제? 다시 누르기`
      : `Delete Slot ${activeSlot}? Press again`;
  };

  /* ───── boot ───── */
  function resize(){
    const r = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, r.width*DPR); cv.height = Math.max(1, r.height*DPR);
    W = r.width; H = r.height;
    const c = cc.getBoundingClientRect();
    CW = c.width || 66;
    cc.width = Math.max(1, CW*DPR); cc.height = Math.max(1, CW*DPR);
  }
  window.addEventListener('resize', resize);
  resize();
  enterTownReady();
  load();
  renderShop();

  let last = performance.now();
  function frame(t){
    const dt = Math.min(0.05, (t - last)/1000);
    last = t;
    if(!dossierOpen){
      S.playMs += dt*1000;
      update(dt);
      saveT += dt; if(saveT > 6){ saveT = 0; save(); }
    }
    draw(); drawCylinder(); syncDom();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
